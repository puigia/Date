<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小屁孩的純約會行事曆～</title>
    
    <!-- 字體引入 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            bg: '#FAF5EF',
                            text: '#382E2B',
                            subtext: '#7A6E65',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & Babel CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <!-- 💌 EmailJS 寄信服務 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #FAF5EF; 
            background-image: radial-gradient(#E2D6C8 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            color: #382E2B;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            position: relative;
        }
        
        .cloud-card {
            position: relative;
            z-index: 1;
            padding: 32px 24px; 
            margin: 18px 12px; 
        }

        .cloud-card::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background-color: #FFFFFF;
            border: 12px solid #E3D1BF;
            border-radius: 40px;
            filter: url(#cloud-wave-filter);
            box-shadow: 0 12px 25px rgba(180, 150, 130, 0.15);
            
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            will-change: filter;
        }

        .cloud-vip-card {
            position: relative;
            z-index: 1;
            padding: 22px 18px;
            margin-top: 16px;
        }

        .cloud-vip-card::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background-color: #FDF4E8;
            border: 6px solid #E3D1BF;
            border-radius: 28px;
            filter: url(#cloud-wave-filter);
            
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            will-change: filter;
        }

        .foam-shape {
            border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px !important;
        }

        .mild-wave-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            filter: url(#mild-wave-filter);
            border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px;
            transition: all 0.2s ease;
            
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        .wavy-input-group {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .wavy-input-group::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background-color: #FAF7F2;
            border: 2px solid #EAE1D7;
            border-radius: 26px 20px 24px 22px / 20px 26px 22px 24px;
            filter: url(#mild-wave-filter);
            transition: all 0.2s ease;
            
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }
        .wavy-input-group:focus-within::before {
            background-color: #FFFFFF;
            border-color: #C89B7B;
            box-shadow: 0 0 0 4px rgba(200, 155, 123, 0.12);
        }
        .wavy-input-group input, 
        .wavy-input-group select, 
        .wavy-input-group textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #382E2B;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #D4B392; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C89B7B; 
        }
        
        .stripe-pattern {
            background: repeating-linear-gradient(
                45deg,
                #F5EFE8,
                #F5EFE8 10px,
                #EAE2D8 10px,
                #EAE2D8 20px
            );
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0.7); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(216, 136, 112, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0); }
        }
        .pulse-badge {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #8C5E3C; font-family: sans-serif; font-size: 16px;">
            載入中... ☕
        </div>
    </div>

    <!-- 隱藏式 SVG 波浪濾鏡 -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; left: -9999px; top: -9999px; pointer-events: none;" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <defs>
            <filter id="cloud-wave-filter" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="mild-wave-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- Firebase SDK 加載 -->
    <script type="module">
        try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            
            window.FirebaseLib = {
                initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
                getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc
            };
            window.dispatchEvent(new Event('firebaseready'));
        } catch(e) {
            console.warn("Firebase Async Load Skip");
        }
    </script>

    <!-- React 核心應用程式 -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const _h = (s) => {
            let h = 0;
            for(let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
            return h;
        };

        const memoryStorage = {};
        const getLocalData = (key, defaultVal) => {
            try {
                const item = window.localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultVal;
            } catch (e) {
                return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal;
            }
        };

        const setLocalData = (key, val) => {
            try {
                window.localStorage.setItem(key, JSON.stringify(val));
            } catch (e) {
                memoryStorage[key] = val;
            }
        };

        const thsrFares = {
            "南港": 0, "台北": 0, "板橋": 0,
            "桃園": 125, "新竹": 250, "苗栗": 385, "台中": 645,
            "彰化": 765, "雲林": 870, "嘉義": 1015, "台南": 1280, "左營": 1415
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            return `${y}-${m}-${day}_${h}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) {
                slots.push(getSlotString(baseDate, i));
            }
            return slots;
        };

        const isSystemUnavailable = (slotStr) => {
            const parts = slotStr.split('_');
            if (parts.length !== 2) return false;
            
            const slotDate = new Date(`${parts[0]}T00:00:00`);
            const hour = parseInt(parts[1], 10);
            
            const limitDate = new Date('2027-01-04T00:00:00'); 
            if (slotDate >= limitDate) return false;

            const day = slotDate.getDay();

            if ((day === 2 || day === 3) && (hour >= 8 && hour < 12)) return true;
            if ((day === 2 || day === 4) && (hour >= 15 && hour < 20)) return true;
            if (day === 5 && (hour >= 13 && hour < 20)) return true;

            return false;
        };

        const deduplicateBookings = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();
            list.forEach(item => {
                if (!item) return;
                const key = item.id || `${item.twitter}_${item.date}_${item.startHour}_${item.duration}`;
                let duplicateFoundKey = null;
                for (let [existingKey, existing] of map.entries()) {
                    if (existing.id === item.id || 
                       (existing.twitter === item.twitter && 
                        existing.date === item.date && 
                        existing.startHour === item.startHour && 
                        existing.duration === item.duration)) {
                        duplicateFoundKey = existingKey;
                        break;
                    }
                }

                if (duplicateFoundKey) {
                    const existing = map.get(duplicateFoundKey);
                    if (item.status === 'confirmed' || item.status === 'completed' || !existing.status) {
                        map.delete(duplicateFoundKey);
                        map.set(key, item);
                    }
                } else {
                    map.set(key, item);
                }
            });
            return Array.from(map.values());
        };

        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0;
            let extraHours = 0;
            const BASE_HR = 1000;
            let midnightCount = 0;
            let midnightSurcharge = 0;

            if (planType === 'overnight' && isVip) {
                const days = Math.floor(duration / 24);
                const remHours = duration % 24;
                basePrice = (days * 18000) + (remHours * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2); 
                if (duration >= 12) basePrice = basePrice * 0.8; 
            } else {
                if (isVip) {
                    if (duration >= 12) basePrice = duration * 660;
                    else if (duration >= 6) basePrice = duration * 750;
                    else basePrice = duration * 800;
                } else {
                    if (duration >= 12) {
                        basePrice = 8800;
                        extraHours = duration - 12;
                    } else if (duration >= 6) {
                        basePrice = 5200;
                        extraHours = duration - 6;
                    } else if (duration >= 4) {
                        basePrice = duration * BASE_HR * 0.9;
                    } else {
                        basePrice = duration * BASE_HR;
                    }

                    if (extraHours > 0) basePrice += extraHours * (BASE_HR * 0.9);
                }

                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) midnightCount++;
                }
                
                if (midnightCount > 0) {
                    if (isVip) {
                        const effectiveRate = basePrice / duration;
                        midnightSurcharge = midnightCount * (BASE_HR - effectiveRate);
                    } else {
                        midnightSurcharge = midnightCount * (BASE_HR * 0.2); 
                    }
                }
            }

            return {
                total: Math.round(basePrice + midnightSurcharge),
                basePrice: Math.round(basePrice),
                midnightSurcharge: Math.round(midnightSurcharge),
                midnightCount,
                isVip
            };
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-extrabold text-[#382E2B] mb-2">{title}</h3>
                        <p className="text-[#7A6E65] mb-6 whitespace-pre-line text-sm leading-relaxed">{message}</p>
                        <button onClick={onClose} className="foam-shape w-full py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">
                            知道啦 ☕
                        </button>
                    </div>
                </div>
            );
        };

        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);

            useEffect(() => {
                setCurrentUrl(encodeURI(imageUrl));
                setHasError(false);
            }, [imageUrl]);

            const handleImgError = () => {
                if (currentUrl.endsWith('.PNG')) setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                else if (currentUrl.endsWith('.png')) setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                else setHasError(true);
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-md border border-[#EAE1D7] flex flex-col max-h-[90vh] shadow-2xl">
                        <h3 className="text-lg font-bold text-[#382E2B] mb-3 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-2xl border border-[#EAE1D7] flex items-center justify-center bg-[#FAF7F2] relative p-2">
                            {!hasError ? (
                                <img src={currentUrl} alt={title} className="w-full h-auto object-contain rounded-xl" onError={handleImgError} />
                            ) : (
                                <div className="text-center p-6 bg-[#FAF4EB] rounded-2xl w-full">
                                    <p className="text-[#B8735C] font-bold mb-2">無法載入圖片 🥺</p>
                                    <p className="text-xs text-[#7A6E65] mb-2">請確認 GitHub 已上傳圖檔：</p>
                                    <p className="text-xs font-mono font-bold text-[#382E2B] break-all bg-white p-2 rounded-xl border border-[#EAE1D7] mb-2">{imageUrl}</p>
                                </div>
                            )}
                        </div>
                        <button onClick={onClose} className="foam-shape w-full mt-4 py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">
                            我已詳閱並了解 ☕
                        </button>
                    </div>
                </div>
            );
        };

        const AdminPendingModal = ({ isOpen, pendingBookings, onApprove, onReject, onClose, onRefresh }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-[#EAE1D7] flex flex-col max-h-[85vh] shadow-2xl">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-xl font-bold text-[#382E2B] flex items-center gap-2">
                                <span>🔔</span> 待審核新預約 ({pendingBookings.length})
                            </h3>
                            <button onClick={onRefresh} className="foam-shape text-xs bg-[#FAF4EB] text-[#8C5E3C] border border-[#E7D4BF] px-3 py-1.5 font-bold hover:bg-[#F3E7D7] transition-colors">
                                🔄 重新整理
                            </button>
                        </div>
                        <p className="text-xs text-[#7A6E65] mb-4">客人送出預約後會顯示在此，點擊「同意」後行事曆才會鎖定為灰底喔！</p>
                        
                        <div className="overflow-y-auto flex-grow mb-4 space-y-3.5 pr-1">
                            {pendingBookings.length === 0 ? (
                                <div className="text-center py-10 text-[#A3968C] font-bold text-sm">目前沒有新的待審核預約唷 ☕</div>
                            ) : (
                                pendingBookings.map(b => (
                                    <div key={b.id} className="bg-[#FAF7F2] p-4 rounded-2xl border border-[#EAE1D7] shadow-sm text-xs text-[#382E2B]">
                                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-[#EAE1D7]">
                                            <span className="font-extrabold text-[#8C5E3C] text-sm">@{b.twitter}</span>
                                            <span className="text-[11px] text-[#A3968C]">{new Date(b.createdAt || Date.now()).toLocaleString('zh-TW', { hour12: false })}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1.5 mb-2.5">
                                            <p><strong>📅 約會日期：</strong>{b.date}</p>
                                            <p><strong>⏰ 開始時間：</strong>{String(b.startHour).padStart(2, '0')}:00</p>
                                            <p><strong>⏱️ 預約時數：</strong>{b.duration} 小時</p>
                                            <p><strong>🎀 方案類型：</strong>{b.planType === 'overnight' ? '過夜之旅' : b.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                                            <p><strong>📍 約會地點：</strong>{b.location || '雙北'}</p>
                                            <p><strong>🚗 交通方式：</strong>{b.transportation || '大眾交通'}</p>
                                            <p className="text-[#C89B7B] font-bold"><strong>💰 總金額：</strong>${(b.priceInfo?.total || 0) + (b.travelFee || 0)}</p>
                                            <p className="text-[#B8735C] font-bold"><strong>💳 應付定金：</strong>${((b.duration >= 12 || b.planType === 'overnight') ? 2000 : (b.duration >= 6 ? 1000 : 500)) + (b.travelFee || 0)}</p>
                                            <p className="text-[#8C5E3C] font-bold col-span-2 bg-[#F3E7D7]/50 p-1.5 rounded-lg border border-[#E7D4BF]/60"><strong>🏦 匯款後五碼：</strong>{b.bankAccountLast5 || '未填寫'}</p>
                                        </div>
                                        <div className="bg-white p-2.5 rounded-xl border border-[#EAE1D7] text-xs mb-3">
                                            <p className="text-[#8C5E3C] font-bold mb-0.5">📝 行程細節：</p>
                                            <p className="text-[#7A6E65] whitespace-pre-line leading-relaxed">{b.itinerary}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => onApprove(b)}
                                                className="foam-shape flex-1 py-2.5 bg-[#849B89] text-white font-bold shadow hover:bg-[#6D8372] transition-all text-xs"
                                            >
                                                ✅ 同意預約 (鎖定時段)
                                            </button>
                                            <button 
                                                onClick={() => onReject(b)}
                                                className="foam-shape py-2.5 px-3 bg-[#FBF0EF] text-[#D98880] font-bold border border-[#F3D7D5] hover:bg-[#D98880] hover:text-white transition-all text-xs"
                                            >
                                                ❌ 拒絕/退回
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <button onClick={onClose} className="foam-shape w-full py-3 bg-[#EAE1D7] text-[#382E2B] font-bold hover:bg-[#DED2C6] transition-colors">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, onConfirmEnd, onRevertComplete, onCancelBooking, onClose }) => {
            if (!isOpen || !booking) return null;
            const isCompleted = booking.status === 'completed';
            
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-bold text-[#382E2B] mb-3">已審核約會管理</h3>
                        {isCompleted && <div className="text-[#6D8372] font-bold mb-3 border border-[#C5D6C9] bg-[#E8EFE9] rounded-xl p-2 text-xs">✅ 此約會已標記為完成</div>}
                        
                        <div className="text-left bg-[#FAF7F2] p-4 rounded-2xl text-xs mb-5 border border-[#EAE1D7] overflow-y-auto max-h-48 leading-relaxed">
                            <p className="mb-1"><strong>帳號：</strong>@{booking.twitter}</p>
                            <p className="mb-1"><strong>日期：</strong>{booking.date}</p>
                            <p className="mb-1"><strong>時間：</strong>{booking.startHour}:00 ({booking.duration}小時)</p>
                            <p className="mb-1"><strong>方案：</strong>{booking.planType === 'overnight' ? '過夜之旅' : booking.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                            <p className="mb-1"><strong>地點/交通：</strong>{booking.location} / {booking.transportation}</p>
                            {booking.travelFee > 0 && <p className="mb-1 text-[#B8735C]"><strong>車馬費：</strong>${booking.travelFee}</p>}
                            <p className="mb-1 text-[#8C5E3C]"><strong>後五碼：</strong>{booking.bankAccountLast5 || '未填'}</p>
                            <p><strong>行程：</strong>{booking.itinerary}</p>
                        </div>
                        
                        <div className="flex flex-col gap-2.5">
                            {!isCompleted ? (
                                <button onClick={() => onConfirmEnd(booking)} className="foam-shape w-full py-3 bg-[#849B89] text-white font-bold shadow-sm hover:bg-[#6D8372] transition-colors text-xs">
                                    ✅ 標記約會成功完成 (次數+1)
                                </button>

                    const b2 = Math.floor((dur - b1) / 2);
                    blocks.push({ s: startH, e: startH + b1 });
                    blocks.push({ s: startH + b1, e: startH + b1 + b2 });
                    blocks.push({ s: startH + b1 + b2, e: startH + dur });
                } else {
                    const step = Math.max(2, Math.floor(dur / 4));
                    let cur = startH;
                    while (cur < startH + dur) {
                        const next = Math.min(startH + dur, cur + step);
                        blocks.push({ s: cur, e: next });
                        cur = next;
                    }
                }

                const buildScheme = (title, idx) => {
                    const lines = [`【${title}】`];
                    blocks.forEach((b, i) => {
                        const h = b.s % 24;
                        let item = '';
                        if (i === 0) {
                            if (pref.includes('電影') || pref.includes('看片')) item = currentCityDB.movie[idx % 3];
                            else if (pref.includes('下午茶') || pref.includes('咖啡') || pref.includes('甜點')) item = currentCityDB.cafe[idx % 3];
                            else item = currentCityDB.shop[idx % 3];
                        } else if (i === 1 && blocks.length >= 3) {
                            item = currentCityDB.cafe[(idx + 1) % 3];
                        } else if (i === blocks.length - 1) {
                            item = (h >= 17 || h < 4 || pref.includes('晚餐') || pref.includes('微醺') || pref.includes('燒肉') || pref.includes('酒'))

                    </div>

                    {/* 管理員控制列 */}
                    <div className="fixed bottom-4 left-4 flex items-center gap-2 z-50">
                        <button onClick={() => { if (isAdmin) setIsAdmin(false); else setShowAdminLogin(true); }} className={`text-xs px-3.5 py-2 shadow transition-all font-bold foam-shape ${isAdmin ? 'bg-[#B8735C] text-white' : 'bg-white text-[#7A6E65] border border-[#EAE1D7] opacity-60 hover:opacity-100'}`}>
                            {isAdmin ? "🔒 關閉管理員" : "管理員登入"}
                        </button>
                        
                        {isAdmin && (
                            <>
                                <button 
                                    onClick={() => setShowPendingModal(true)} 
                                    className={`text-xs px-3.5 py-2 shadow transition-all font-bold flex items-center gap-1.5 foam-shape ${pendingBookings.length > 0 ? 'bg-[#B8735C] text-white pulse-badge' : 'bg-[#FAF4EB] text-[#8C5E3C] border border-[#E7D4BF]'}`}
                                >
                                    <span>🔔</span> 新預約通知
                                    {pendingBookings.length > 0 && <span className="bg-white text-[#B8735C] text-[10px] px-1.5 py-0.2 rounded-full font-extrabold">{pendingBookings.length}</span>}
                                </button>
                                <button onClick={() => setShowMembersModal(true)} className="text-xs px-3.5 py-2 shadow transition-all bg-[#8C5E3C] text-white font-bold hover:bg-[#724B2E] foam-shape">
                                    👥 會員管理
                                </button>
                            </>
                        )}
                    </div>

                    {/* 管理員登入 Modal */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-xs border-2 border-[#EAE1D7] text-center shadow-2xl">
                                <h3 className="text-lg font-bold text-[#382E2B] mb-4">輸入管理員密碼</h3>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} className="cream-input foam-shape w-full p-3 mb-4 text-center tracking-widest font-mono text-lg border border-[#EAE1D7]" placeholder="••••" autoFocus />
                                <div className="flex gap-2">
                                    <button onClick={() => { setShowAdminLogin(false); setAdminPwd(''); }} className="foam-shape w-1/2 py-2.5 bg-[#EAE1D7] text-[#382E2B] font-bold text-xs">取消</button>
                                    <button onClick={() => { 
                                        if (_h(adminPwd) === 1538181) { 
                                            setIsAdmin(true); setShowAdminLogin(false); setAdminPwd(''); 
                                        } else { 
                                            showModal('錯誤', '密碼錯誤！'); setAdminPwd(''); 
                                        } 
                                    }} className="foam-shape w-1/2 py-2.5 bg-[#C89B7B] text-white font-bold text-xs">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <AdminPendingModal 
                        isOpen={showPendingModal}
                        pendingBookings={pendingBookings}
                        onRefresh={syncAllData}
                        onClose={() => setShowPendingModal(false)}
                        onApprove={(b) => {
                            const localBookings = getLocalData('cute_calendar_bookings', []);
                            const updated = localBookings.map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated));
                            setLocalData('cute_calendar_bookings', updated);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, updateDoc } = window.FirebaseLib;
                                    updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                            showModal('審核通過 ✨', `已同意 @${b.twitter} 的約會！該時段已在行事曆鎖定為灰底。`);
                        }}
                        onReject={(b) => {
                            const localBookings = getLocalData('cute_calendar_bookings', []);
                            const updated = localBookings.filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated));
                            setLocalData('cute_calendar_bookings', updated);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, deleteDoc } = window.FirebaseLib;
                                    deleteDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                            showModal('已拒絕', `已退回 @${b.twitter} 的預約申請。`);
                        }}
                    />

    <AdminBookingModal 
                        isOpen={!!selectedAdminBooking} 
                        booking={selectedAdminBooking}
                        onClose={() => setSelectedAdminBooking(null)}
                        onConfirmEnd={(b) => {
                            const localBookings = getLocalData('cute_calendar_bookings', []);
                            const updated = localBookings.map(item => item.id === b.id ? { ...item, status: 'completed' } : item);
                            setBookings(deduplicateBookings(updated));
                            setLocalData('cute_calendar_bookings', updated);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, updateDoc } = window.FirebaseLib;
                                    updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'completed' }).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                            setSelectedAdminBooking(null);
                            showModal('標記成功 🎉', `已將 @${b.twitter} 的此筆約會標記為「已完成」！(次數計入 1 次)`);
                        }}
                        onRevertComplete={(b) => {
                            const localBookings = getLocalData('cute_calendar_bookings', []);
                            const updated = localBookings.map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated));
                            setLocalData('cute_calendar_bookings', updated);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, updateDoc } = window.FirebaseLib;
                                    updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                            setSelectedAdminBooking(null);
                            showModal('已撤銷', `已將約會狀態恢復為「已核準」。`);
                        }}
                        onCancelBooking={(b) => {
                            const localBookings = getLocalData('cute_calendar_bookings', []);
                            const updated = localBookings.filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated));
                            setLocalData('cute_calendar_bookings', updated);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, deleteDoc } = window.FirebaseLib;
                                    deleteDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                            setSelectedAdminBooking(null);
                            showModal('已刪除', '已取消該預約並釋出時段！');
                        }}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal}
                        members={members}
                        bookings={bookings}
                        onClose={() => setShowMembersModal(false)}
                        onToggleBlacklist={(handle, currentStatus) => {
                            const updatedMembers = { ...members, [handle]: { ...members[handle], isBlacklisted: !currentStatus } };
                            setMembers(updatedMembers);
                            setLocalData('cute_calendar_members', updatedMembers);

                            if (db && window.FirebaseLib) {
                                try {
                                    const { doc, setDoc } = window.FirebaseLib;
                                    setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { isBlacklisted: !currentStatus }, { merge: true }).catch(e => console.warn(e));
                                } catch (e) { console.warn(e); }
                            }
                        }}
                    />

                    <CustomerHistoryModal
                        isOpen={showHistoryModal}
                        history={customerHistory}
                        onClose={() => setShowHistoryModal(false)}
                    />

                    <ImageModal 
                        isOpen={showRulesModal}
                        title="約會規則與細則詳閱"
                        imageUrl="rules.PNG"
                        onClose={() => setShowRulesModal(false)}
                    />

                    <ImageModal 
                        isOpen={modalConfig.isImage}
                        title={modalConfig.title}
                        imageUrl={modalConfig.url}
                        onClose={closeModal}
                    />

                    <Modal isOpen={modalConfig.isOpen && !modalConfig.isImage} title={modalConfig.title} message={modalConfig.message} onClose={closeModal} />
                </div>
            );
        };

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch(e) {
            console.error("React Render Error:", e);
        }
    </script>
</body>
</html>
