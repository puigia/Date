    <!-- 高穩定度 cdnjs 載入 React -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <style>
        body {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 24px 24px;
            color: #4a044e;
            -webkit-tap-highlight-color: transparent;
        }
        .cute-border {

        ::-webkit-scrollbar-track {

            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }

</head>
<body>
    <div id="root">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #a855f7; font-family: sans-serif;">
            🌸 載入小屁孩約會行事曆中...
        </div>
    </div>

    <!-- Firebase SDK 匯入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        window.FirebaseLib = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
            getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc
        };
        window.dispatchEvent(new Event('firebaseready'));
    </script>

    <!-- React 應用程式本體 -->
    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo } = React;

        // iPhone 無痕模式快取安全保護
        const memoryStorage = {};
        const getLocalData = (key, defaultVal) => {
            try {
                const item = window.localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultVal;
            } catch (e) {
                return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal;
            }
        };

        const setLocalData = (key, val) => {
            try {
                window.localStorage.setItem(key, JSON.stringify(val));
            } catch (e) {
                memoryStorage[key] = val;
            }
        };

        // 高鐵車馬費表
        const thsrFares = {
            "南港": 0, "台北": 0, "板橋": 0,
            "桃園": 125, "新竹": 250, "苗栗": 385, "台中": 645,
            "彰化": 765, "雲林": 870, "嘉義": 1015, "台南": 1280, "左營": 1415
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            return `${y}-${m}-${day}_${h}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) {
                slots.push(getSlotString(baseDate, i));
            }
            return slots;
        };

        // 計價演算法
        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0;
            let extraHours = 0;
            const BASE_HR = 1000;
            let midnightCount = 0;
            let midnightSurcharge = 0;

            if (planType === 'overnight' && isVip) {
                const days = Math.floor(duration / 24);
                const remHours = duration % 24;
                basePrice = (days * 18000) + (remHours * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2); 
                if (duration >= 12) basePrice = basePrice * 0.8; 
            } else {
                if (isVip) {
                    if (duration >= 12) basePrice = duration * 660;
                    else if (duration >= 6) basePrice = duration * 750;
                    else basePrice = duration * 800;
                } else {
                    if (duration >= 12) {
                        basePrice = 8800;
                        extraHours = duration - 12;
                    } else if (duration >= 6) {
                        basePrice = 5200;
                        extraHours = duration - 6;
                    } else if (duration >= 4) {
                        basePrice = duration * BASE_HR * 0.9;
                    } else {
                        basePrice = duration * BASE_HR;
                    }

                    if (extraHours > 0) basePrice += extraHours * (BASE_HR * 0.9);
                }

                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) midnightCount++;
                }
                
                if (midnightCount > 0) {
                    if (isVip) {
                        const effectiveRate = basePrice / duration;
                        midnightSurcharge = midnightCount * (BASE_HR - effectiveRate);
                    } else {
                        midnightSurcharge = midnightCount * (BASE_HR * 0.2); 
                    }
                }
            }

            return {
                total: Math.round(basePrice + midnightSurcharge),
                basePrice: Math.round(basePrice),
                midnightSurcharge: Math.round(midnightSurcharge),
                midnightCount,
                isVip
            };
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-pink transform transition-all text-center">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-2">{title}</h3>
                        <p className="text-ins-text mb-6 whitespace-pre-line text-sm leading-relaxed">{message}</p>
                        <button onClick={onClose} className="w-full py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            知道啦！💕
                        </button>
                    </div>
                </div>
            );
        };

        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);

            useEffect(() => {
                setCurrentUrl(encodeURI(imageUrl));
                setHasError(false);
            }, [imageUrl]);

            const handleImgError = () => {
                if (currentUrl.endsWith('.PNG')) setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                else if (currentUrl.endsWith('.png')) setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                else setHasError(true);
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-4 w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
                        <h3 className="text-lg font-bold text-ins-darkPurple mb-2 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-xl border border-pink-100 flex items-center justify-center bg-gray-50 relative p-2">
                            {!hasError ? (
                                <img src={currentUrl} alt={title} className="w-full h-auto object-contain rounded-lg" onError={handleImgError} />
                            ) : (
                                <div className="text-center p-6 bg-pink-50 rounded-xl w-full">
                                    <p className="text-red-500 font-bold mb-2">無法載入圖片 🥺</p>
                                    <p className="text-sm text-gray-600 mb-2">請確認 GitHub 已上傳圖檔：</p>
                                    <p className="text-xs font-bold text-ins-darkPurple break-all bg-white p-2 rounded border border-pink-200 mb-2">{imageUrl}</p>
                                </div>
                            )}
                        </div>
                        <button onClick={onClose} className="w-full mt-4 py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            我已詳閱並了解 💕
                        </button>
                    </div>
                </div>
            );
        };

        // 管理員：新預約審核 Modal
        const AdminPendingModal = ({ isOpen, pendingBookings, onApprove, onReject, onClose, onRefresh }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-cute border-2 border-ins-purple transform transition-all flex flex-col max-h-[85vh]">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-xl font-bold text-ins-darkPurple flex items-center gap-2">
                                <span>🔔</span> 待審核新預約 ({pendingBookings.length})
                            </h3>
                            <button onClick={onRefresh} className="text-xs bg-pink-100 text-ins-darkPurple px-2.5 py-1 rounded-lg font-bold hover:bg-pink-200 transition-colors">
                                🔄 重新整理
                            </button>
                        </div>
                        <p className="text-xs text-gray-500 text-center mb-4">客人送出預約後會顯示在此，點擊「核准」後行事曆才會鎖定為灰底喔！</p>
                        
                        <div className="overflow-y-auto flex-grow mb-4 space-y-4">
                            {pendingBookings.length === 0 ? (
                                <div className="text-center py-8 text-gray-400 font-bold">目前沒有新的待審核預約唷～🌸</div>
                            ) : (
                                pendingBookings.map(b => (
                                    <div key={b.id} className="bg-pink-50/70 p-4 rounded-2xl border-2 border-pink-200 shadow-sm text-sm text-gray-700">
                                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-pink-200">
                                            <span className="font-extrabold text-ins-darkPurple text-base">@{b.twitter}</span>
                                            <span className="text-xs text-gray-500">{new Date(b.createdAt || Date.now()).toLocaleString('zh-TW', { hour12: false })}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1 mb-2 text-xs">
                                            <p><strong>📅 約會日期：</strong>{b.date}</p>
                                            <p><strong>⏰ 開始時間：</strong>{String(b.startHour).padStart(2, '0')}:00</p>
                                            <p><strong>⏱️ 預約時數：</strong>{b.duration} 小時</p>
                                            <p><strong>🎀 方案類型：</strong>{b.planType === 'overnight' ? '過夜之旅' : b.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                                            <p><strong>📍 約會地點：</strong>{b.location || '雙北'}</p>
                                            <p><strong>🚗 交通方式：</strong>{b.transportation || '大眾交通'}</p>
                                            <p className="text-ins-accent font-bold"><strong>💰 總金額：</strong>${(b.priceInfo?.total || 0) + (b.travelFee || 0)}</p>
                                            <p className="text-red-500 font-bold"><strong>💳 應付定金：</strong>${((b.duration >= 12 || b.planType === 'overnight') ? 2000 : (b.duration >= 6 ? 1000 : 500)) + (b.travelFee || 0)}</p>
                                            <p className="text-ins-darkPurple font-bold col-span-2"><strong>🏦 匯款後五碼：</strong>{b.bankAccountLast5 || '未填寫'}</p>
                                        </div>
                                        <div className="bg-white p-2.5 rounded-xl border border-pink-200 text-xs mb-3">
                                            <p className="text-ins-darkPurple font-bold mb-0.5">📝 行程細節：</p>
                                            <p className="text-gray-600 whitespace-pre-line">{b.itinerary}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => onApprove(b)}
                                                className="flex-1 py-2.5 bg-[#00B900] text-white font-bold rounded-xl shadow hover:bg-green-600 transition-all text-xs"
                                            >
                                                ✅ 同意預約 (鎖定時段為灰底)
                                            </button>
                                            <button 
                                                onClick={() => onReject(b)}
                                                className="py-2.5 px-3 bg-red-100 text-red-600 font-bold rounded-xl hover:bg-red-500 hover:text-white transition-all text-xs"
                                            >
                                                ❌ 拒絕/退回
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <button onClick={onClose} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-colors">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, onConfirmEnd, onRevertComplete, onCancelBooking, onClose }) => {
            if (!isOpen || !booking) return null;
            const isCompleted = booking.status === 'completed';
            
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-purple transform transition-all text-center">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4">已審核約會管理</h3>
                        {isCompleted && <div className="text-green-600 font-bold mb-3 border-2 border-green-200 bg-green-50 rounded-lg p-2 text-xs">✅ 此約會已標記為完成</div>}
                        
                        <div className="text-left bg-gray-50 p-4 rounded-xl text-sm mb-6 border border-gray-200 overflow-y-auto max-h-48">
                            <p className="mb-1"><strong>帳號：</strong>@{booking.twitter}</p>
                            <p className="mb-1"><strong>日期：</strong>{booking.date}</p>
                            <p className="mb-1"><strong>時間：</strong>{booking.startHour}:00 ({booking.duration}小時)</p>
                            <p className="mb-1"><strong>方案：</strong>{booking.planType === 'overnight' ? '過夜之旅' : booking.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                            <p className="mb-1"><strong>地點/交通：</strong>{booking.location} / {booking.transportation}</p>
                            {booking.travelFee > 0 && <p className="mb-1 text-red-500"><strong>車馬費：</strong>${booking.travelFee}</p>}
                            <p><strong>行程：</strong>{booking.itinerary}</p>
                        </div>
                        
                        <div className="flex flex-col gap-3">
                            {!isCompleted ? (
                                <button onClick={() => onConfirmEnd(booking)} className="w-full py-3 bg-[#00B900] text-white font-bold rounded-xl shadow-md hover:bg-green-600 transition-colors text-xs">
                                    ✅ 標記約會成功完成 (次數+1)
                                </button>
                            ) : (
                                <button onClick={() => onRevertComplete(booking)} className="w-full py-3 bg-yellow-500 text-white font-bold rounded-xl shadow-md hover:bg-yellow-600 transition-colors text-xs">
                                    ↩️ 撤銷完成標記 (恢復為已確認)
                                </button>
                            )}
                            <button onClick={() => onCancelBooking(booking)} className="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-md hover:bg-red-600 transition-colors text-xs">
                                🗑️ 取消並刪除此預約 (釋出時段)
                            </button>
                            <button onClick={onClose} className="w-full py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-colors text-xs">
                                返回
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CustomerHistoryModal = ({ isOpen, history, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-pink transform transition-all flex flex-col max-h-[80vh]">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4 text-center">📜 過往約會紀錄</h3>
                        <p className="text-xs text-gray-500 mb-3 text-center">以下是您已經成功完成的約會💕</p>
                        <div className="overflow-y-auto flex-grow mb-4">
                            {history.length === 0 ? (
                                <p className="text-center text-gray-500 text-sm py-4">目前還沒有已完成的紀錄唷！</p>
                            ) : (
                                history.map(b => (
                                    <div key={b.id} className="bg-pink-50 p-4 rounded-xl mb-3 border border-pink-200 text-sm shadow-sm relative">
                                        <div className="absolute top-3 right-3 text-green-600 font-bold text-xs flex items-center gap-1 bg-green-100 px-2 py-1 rounded-md">
                                            <span>✅</span> 已完成
                                        </div>
                                        <p className="font-bold text-ins-darkPurple text-base mb-1">{b.date}</p>
                                        <p className="text-gray-700 font-medium mb-1">方案：{b.planType === 'overnight' ? '過夜之旅' : b.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                                        <p className="text-gray-600">時長：{b.duration} 小時</p>
                                    </div>
                                ))
                            )}
                        </div>
                        <button onClick={onClose} className="w-full py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const AdminMembersModal = ({ isOpen, members, onClose, onToggleBlacklist }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-cute border-2 border-ins-purple transform transition-all flex flex-col max-h-[80vh]">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4 text-center">👥 會員與黑名單管理</h3>
                        <div className="overflow-y-auto flex-grow mb-4">
                            {Object.entries(members).map(([handle, data]) => (
                                <div key={handle} className={`flex justify-between items-center p-3 mb-2 rounded-xl border ${data.isBlacklisted ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'}`}>
                                    <div>
                                        <span className="font-bold text-ins-darkPurple">@{handle}</span>
                                        <span className="text-xs text-gray-500 ml-2">完成次數: {data.bookingCount || 0}</span>
                                    </div>
                                    <button 
                                        onClick={() => onToggleBlacklist(handle, data.isBlacklisted)}
                                        className={`text-xs px-3 py-1 rounded-full font-bold transition-colors ${data.isBlacklisted ? 'bg-gray-200 text-gray-700 hover:bg-gray-300' : 'bg-red-100 text-red-500 hover:bg-red-500 hover:text-white'}`}
                                    >
                                        {data.isBlacklisted ? '解除黑名單' : '加入黑名單'}
                                    </button>
                                </div>
                            ))}
                            {Object.keys(members).length === 0 && (
                                <p className="text-center text-gray-500 text-sm py-4">尚無會員資料</p>
                            )}
                        </div>
                        <button onClick={onClose} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-colors">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'cute-dating-calendar-v1';
            
            // 雲端資料庫備用公開 Config (確保 GitHub Pages 跨手機資料即時同步)
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyBvW3x4X8_dummy_key",
                authDomain: `${appId}.firebaseapp.com`,
                projectId: appId,
                storageBucket: `${appId}.appspot.com`,
            };

            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            
            const [bookings, setBookings] = useState([]);
            const [unavailables, setUnavailables] = useState([]);
            const [members, setMembers] = useState({});

            const [selectedDate, setSelectedDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [bookingStartData, setBookingStartData] = useState(null); 
            
            const [selectedDays, setSelectedDays] = useState(0);
            const [selectedDuration, setSelectedDuration] = useState(2); 
            const [twitterHandle, setTwitterHandle] = useState('');
            const [planType, setPlanType] = useState('normal');
            const [itinerary, setItinerary] = useState('');
            const [bankAccountLast5, setBankAccountLast5] = useState('');
            
            const [location, setLocation] = useState('板橋');
            const [transportation, setTransportation] = useState('大眾交通');

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPwd, setAdminPwd] = useState('');
            const [showMembersModal, setShowMembersModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [showRulesModal, setShowRulesModal] = useState(false);
            const [showPendingModal, setShowPendingModal] = useState(false);
            const [selectedAdminBooking, setSelectedAdminBooking] = useState(null);
            
            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '' });
            const [isGeneratingItinerary, setIsGeneratingItinerary] = useState(false);
            
            // 預約流程狀態
            const [bookingSuccessData, setBookingSuccessData] = useState(null);
            const [pendingBookingPayload, setPendingBookingPayload] = useState(null);
            const [isCopied, setIsCopied] = useState(false);

            const showModal = (title, message) => setModalConfig({ isOpen: true, title, message });
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false, isImage: false });

            const totalHours = useMemo(() => {
                if (planType === 'overnight') return (selectedDays * 24) + selectedDuration;
                return selectedDuration;
            }, [planType, selectedDays, selectedDuration]);

            useEffect(() => {
                if (planType !== 'overnight') {
                    setSelectedDays(0);
                    if (selectedDuration < 2) setSelectedDuration(2);
                    if (planType === 'normal' && selectedDuration > 18) setSelectedDuration(18);
                } else {
                    if (selectedDays === 0) setSelectedDays(1);
                    setSelectedDuration(0);
                }
            }, [planType]);

            const travelFee = useMemo(() => {
                if (transportation === '召喚小屁孩至外縣市約會（需收取車馬費）') {
                    const singleFare = thsrFares[location] || 0;
                    return singleFare * 2;
                }
                return 0;
            }, [location, transportation]);

            const depositAmount = useMemo(() => {
                let baseDeposit = 500;
                if (totalHours >= 12 || planType === 'overnight') baseDeposit = 2000;
                else if (totalHours >= 6) baseDeposit = 1000;
                
                return baseDeposit + travelFee;
            }, [totalHours, planType, travelFee]);

            // 升級版 AI 幫排行程（前置檢測 + 乾淨無雜字時間表）
            const handleAIGenerateItinerary = async () => {
                if (!bookingStartData) {
                    showModal('等一下下唷！🌸', '請先在左側月曆上選擇「約會開始時間」，並填寫您期望的約會風格/想法再點擊 AI 幫忙排行程喔！');
                    return;
                }

                if (!itinerary.trim()) {
                    showModal('等一下下唷！🌸', '請先在「行程細節與備註」欄位輸入您期望的約會風格或想法（例如：想逛街、看電影、吃燒肉、喝下午茶），AI 才能為您精準規劃喔！');
                    return;
                }

                setIsGeneratingItinerary(true);
                try {
                    const startHour = bookingStartData.hour;
                    const endHourTotal = startHour + totalHours;
                    const startHourStr = `${String(startHour).padStart(2, '0')}:00`;
                    const endHourStr = `${String(endHourTotal % 24).padStart(2, '0')}:00`;

                    const systemPrompt = `你是一個專業的浪漫約會排程產生器。請根據客人的地點、時間段與個人偏好，輸出行程表。

【絕對嚴格規範 - 違反將導致系統錯誤】
1. 【禁止任何廢話/問候/說明】：絕對不能出現任何開場白、問候語、結尾祝福、自我介紹或額外說明（例如禁止出現「好的」、「以下是為您規劃的行程」、「祝你們玩得開心」等任何非行程文字！）。
2. 【純粹的行程表】：輸出內容的第一個字必須直接是第一個時間段，最後一個字必須是最後一個選項。
3. 【精準時間劃分】：把 ${startHourStr} 至 ${endHourStr} (共 ${totalHours} 小時) 劃分為合理的時間區間。
4. 【多選項推薦】：每一個時間段內挑選 2~3 個該地點近期網路上討論度高、知名或熱門的具體景點/餐廳/影城/展覽供挑選。
5. 【針對特定偏好加強】：
   - 若提到逛街/購物：精選 2~5 個當地熱門百貨、商圈或市集。
   - 若提到下午茶/甜點/咖啡廳：精選 2~5 家當地高評價特色咖啡廳。
6. 【文字格式】：絕對不要使用 Markdown 粗體符號（如 ** 符號）。排版乾淨清晰，方便複製與直接閱讀。`;

                    const userQuery = `【約會條件】
📍 約會地點：${location}
⏰ 約會時段：${startHourStr} ~ ${endHourStr} (共 ${totalHours} 小時)
📝 客人期望的約會風格與想法：${itinerary.trim()}`;

                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });

                    const result = await response.json();
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                        let text = result.candidates[0].content.parts[0].text;
                        // 二次清理可能的粗體標籤
                        text = text.replace(/\*\*/g, '');
                        setItinerary(text.trim());
                    } else {
                        showModal('哎呀！', 'AI 顧問腦袋打結了，請再試一次唷！🥺');
                    }
                } catch (error) {
                    showModal('哎呀！', '呼叫 AI 顧問失敗了，網路可能有點問題～🥺');
                } finally {
                    setIsGeneratingItinerary(false);
                }
            };

            // Firebase 初始化
            useEffect(() => {
                const initFb = () => {
                    if (window.FirebaseLib) {
                        try {
                            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseLib;
                            const appInst = initializeApp(firebaseConfig);
                            const dbInst = getFirestore(appInst);
                            const authInst = getAuth(appInst);
                            setDb(dbInst);
                            signInAnonymously(authInst).catch(e => console.warn(e));
                            onAuthStateChanged(authInst, (u) => setUser(u));
                        } catch(e) { console.warn("Firebase fallback to local"); }
                    }
                };

                initFb();
                window.addEventListener('firebaseready', initFb);
                return () => window.removeEventListener('firebaseready', initFb);
            }, []);

            // 資料即時同步 (合併 Firebase 與 LocalStorage)
            const syncAllData = () => {
                setBookings(getLocalData('cute_calendar_bookings', []));
                setUnavailables(getLocalData('cute_calendar_unavailables', []));
                setMembers(getLocalData('cute_calendar_members', {}));
            };

            useEffect(() => {
                syncAllData();

                if (!db || !window.FirebaseLib) return;

                const { collection, query, onSnapshot } = window.FirebaseLib;
                let unsub1, unsub2, unsub3;

                try {
                    unsub1 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/bookings`)), snap => {
                        const b = []; 
                        snap.forEach(doc => b.push({ id: doc.id, ...doc.data() })); 
                        
                        const localB = getLocalData('cute_calendar_bookings', []);
                        const mergedMap = {};
                        [...localB, ...b].forEach(item => { if(item.id) mergedMap[item.id] = item; });
                        const mergedList = Object.values(mergedMap);

                        setBookings(mergedList);
                        setLocalData('cute_calendar_bookings', mergedList);
                    }, () => syncAllData());

                    unsub2 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/unavailables`)), snap => {
                        const u = []; snap.forEach(doc => u.push(doc.id)); 
                        setUnavailables(u);
                        setLocalData('cute_calendar_unavailables', u);
                    }, () => syncAllData());

                    unsub3 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/members`)), snap => {
                        const m = {}; snap.forEach(doc => { m[doc.id] = doc.data(); }); 
                        setMembers(m);
                        setLocalData('cute_calendar_members', m);
                    }, () => syncAllData());
                } catch (e) {
                    syncAllData();
                }

                return () => {
                    if (unsub1) unsub1();
                    if (unsub2) unsub2();
                    if (unsub3) unsub3();
                };
            }, [db, user]);

            // 只有已被管理員確認 (confirmed 或 completed) 的約會，才會鎖定為灰底
            const bookedSlotsMap = useMemo(() => {
                const map = {};
                bookings.forEach(b => { 
                    if (b.status === 'confirmed' || b.status === 'completed') {
                        (b.slots || []).forEach(s => { map[s] = b; }); 
                    }
                });
                return map;
            }, [bookings]);

            const bufferSlotsMap = useMemo(() => {
                const map = {};
                bookings.forEach(b => {
                    if ((b.status === 'confirmed' || b.status === 'completed') && b.date && b.startHour !== undefined && b.duration !== undefined) {
                        const baseDate = new Date(`${b.date}T00:00:00`);
                        map[getSlotString(baseDate, b.startHour - 1)] = true;
                        map[getSlotString(baseDate, b.startHour + b.duration)] = true;
                    }
                });
                return map;
            }, [bookings]);

            // 待管理員審核的新預約列表
            const pendingBookings = useMemo(() => {
                return bookings.filter(b => b.status === 'pending_review');
            }, [bookings]);

            const currentMemberData = useMemo(() => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                if (!handle) return null;
                return members[handle];
            }, [twitterHandle, members]);

            const customerHistory = useMemo(() => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                if (!handle) return [];
                return bookings
                    .filter(b => b.twitter === handle && b.status === 'completed')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [bookings, twitterHandle]);

            const isVip = (currentMemberData?.bookingCount || 0) >= 3;
            const isBlacklisted = currentMemberData?.isBlacklisted || false;

            useEffect(() => {
                if (!isVip && planType !== 'normal') setPlanType('normal');
            }, [isVip, planType]);

            const priceInfo = useMemo(() => {
                if (bookingStartData === null) return null;
                return calculatePrice(bookingStartData.hour, totalHours, isVip, planType);
            }, [bookingStartData, totalHours, isVip, planType]);

            const handleDateChange = (offset) => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() + offset);
                setSelectedDate(d.toLocaleDateString('en-CA'));
            };

            const checkSlotsAvailability = (startDate, startH, dur) => {
                const targetSlots = generateSlotsForBooking(startDate, startH, dur);
                for (let s of targetSlots) {
                    if (bookedSlotsMap[s] || unavailables.includes(s) || bufferSlotsMap[s]) return false;
                }
                return true;
            };

            const handleSlotClick = async (hour) => {
                const slotStr = getSlotString(new Date(`${selectedDate}T00:00:00`), hour);
                
                if (isAdmin) {
                    if (bookedSlotsMap[slotStr]) {
                        setSelectedAdminBooking(bookedSlotsMap[slotStr]);
                        return;
                    }
                    try {
                        const newUnav = unavailables.includes(slotStr) 
                            ? unavailables.filter(u => u !== slotStr) 
                            : [...unavailables, slotStr];
                        setUnavailables(newUnav);
                        setLocalData('cute_calendar_unavailables', newUnav);

                        if (db && window.FirebaseLib) {
                            const { doc, setDoc, deleteDoc } = window.FirebaseLib;
                            const docRef = doc(db, `artifacts/${appId}/public/data/unavailables`, slotStr);
                            if (unavailables.includes(slotStr)) await deleteDoc(docRef);
                            else await setDoc(docRef, { markedByAdmin: true });
                        }
                    } catch (e) { console.error(e); }
                    return;
                }

                if (bookedSlotsMap[slotStr] || unavailables.includes(slotStr) || bufferSlotsMap[slotStr]) return; 

                if (checkSlotsAvailability(selectedDate, hour, totalHours)) {
                    setBookingStartData({ date: selectedDate, hour: hour });
                } else {
                    showModal('哎呀！', `您選擇的時數往後推算會遇到不開放時段唷，請重新選擇～🎀`);
                }
            };

            useEffect(() => {
                if (bookingStartData !== null && !isAdmin) {
                    if (!checkSlotsAvailability(bookingStartData.date, bookingStartData.hour, totalHours)) {
                        setBookingStartData(null);
                        showModal('提示', `因為更改了預約時數，原先選擇的時段有衝突，請重新選擇開始時間哦！🎀`);
                    }
                }
            }, [totalHours]);

            // 表單送出：產生預約信與 LINE 跳轉網址
            const handleBookingSubmit = () => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                
                if (!handle) return showModal('等一下！', '要填寫推特帳號才能聯繫到你唷～');
                if (isBlacklisted) return showModal('抱歉', '系統無法接受您的預約，若有疑問請聯繫官方客服。');
                if (bookingStartData === null) return showModal('等一下！', '還沒選擇幾點開始約會呢！⏰');
                if (!itinerary.trim()) return showModal('等一下！', '行程細節也要跟我說一下嘛～想去哪裡玩？📝');
                if (!bankAccountLast5 || bankAccountLast5.length < 5) return showModal('等一下！', '請輸入完整的匯款帳號「後五碼」唷！💳');

                if (!checkSlotsAvailability(bookingStartData.date, bookingStartData.hour, totalHours)) {
                    setBookingStartData(null);
                    return showModal('哎呀！', '這個時段剛剛被別人手刀搶走或不開放了，請重選唷！🥲');
                }

                const targetSlots = generateSlotsForBooking(bookingStartData.date, bookingStartData.hour, totalHours);
                const bookingData = {
                    twitter: handle,
                    date: bookingStartData.date,
                    startHour: bookingStartData.hour,
                    duration: totalHours,
                    planType: planType,
                    slots: targetSlots,
                    status: 'pending_review',
                    location: location,
                    transportation: transportation,
                    travelFee: travelFee,
                    itinerary: itinerary.trim(),
                    priceInfo: priceInfo,
                    bankAccountLast5: bankAccountLast5,
                    createdAt: new Date().toISOString()
                };

                const planName = planType === 'overnight' ? '全日or多日的過夜浪漫之旅' : planType === 'cuddle' ? '純抱抱睡方案' : '一般約會';

                const summary = `【預約確認信💌】
推特帳號：@${handle}
預約日期：${bookingStartData.date}
開始時間：${String(bookingStartData.hour).padStart(2, '0')}:00
預約時數：${totalHours} 小時 ${planType === 'overnight' ? `(${selectedDays}天 ${selectedDuration}小時)` : ''}
預約方案：${planName}
約會地點：${location}
交通方式：${transportation}

費用總計：$${priceInfo.total}
車馬費：$${travelFee}
應繳定金(含車馬)：$${depositAmount}

行程細節：
${itinerary.trim()}

匯款帳號：
台北富邦銀行 (012) 81680004182967
匯款帳號後五碼：${bankAccountLast5}

請確認以上資訊無誤後傳送本訊息！💕`;

                setPendingBookingPayload({ bookingData, handle });
                setBookingSuccessData(summary);
                setIsCopied(false);
            };

            // 步驟 1：複製文字
            const handleCopyText = () => {
                if (!bookingSuccessData) return;
                try {
                    const tempInput = document.createElement("textarea");
                    tempInput.value = bookingSuccessData;
                    tempInput.style.position = "fixed";
                    tempInput.style.left = "-9999px";
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    tempInput.setSelectionRange(0, 99999);
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    setIsCopied(true);
                    alert('✅ 預約確認信內容已成功複製！請點擊【步驟二】跳轉 LINE 貼上傳送唷💕');
                } catch (e) {
                    alert('複製失敗，請手動長按下方文字全選複製喔！');
                }
            };

            // 步驟 2：點擊步驟二時同步將預約資料存入後台與本地
            const handleStep2Click = () => {
                if (!pendingBookingPayload) return;

                const newBooking = { id: 'b_' + Date.now(), ...pendingBookingPayload.bookingData };
                
                // 本地儲存更新
                const updatedBookings = [...bookings, newBooking];
                setBookings(updatedBookings);
                setLocalData('cute_calendar_bookings', updatedBookings);

                const updatedMembers = { ...members, [pendingBookingPayload.handle]: { twitter: pendingBookingPayload.handle } };
                setMembers(updatedMembers);
                setLocalData('cute_calendar_members', updatedMembers);

                // 雲端寫入通知後台
                if (db && window.FirebaseLib) {
                    try {
                        const { doc, setDoc, collection } = window.FirebaseLib;
                        const newDocRef = doc(collection(db, `artifacts/${appId}/public/data/bookings`));
                        setDoc(newDocRef, pendingBookingPayload.bookingData).catch(e => console.warn(e));
                        const memberRef = doc(db, `artifacts/${appId}/public/data/members`, pendingBookingPayload.handle);
                        setDoc(memberRef, { twitter: pendingBookingPayload.handle }, { merge: true }).catch(e => console.warn(e));
                    } catch (e) { console.warn("Firebase save error", e); }
                }
            };

            const resetAllToHome = () => {
                setBookingSuccessData(null);
                setPendingBookingPayload(null);
                setIsCopied(false);
                setBookingStartData(null);
                setItinerary('');
                setBankAccountLast5('');
            };

            const summaryText = bookingSuccessData || '';
            const lineOaMsgUrl = `https://line.me/R/oaMessage/@tte0624e/?${encodeURIComponent(summaryText)}`;
            const lineShareUrl = `https://line.me/R/msg/text/?${encodeURIComponent(summaryText)}`;
            const lineProfileUrl = `https://line.me/R/ti/p/@tte0624e`;

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                    <div className="text-center mb-8 relative">
                        <h1 className="text-3xl md:text-4xl font-extrabold text-ins-darkPurple tracking-wider pt-6 pb-2 inline-block relative z-10">
                            ✨ 小屁孩的純約會行事曆 ✨
                        </h1>
                        <p className="text-ins-text font-medium mt-2">牽手、逛街、吃飯、看電影... 陪你度過浪漫時光 🎀</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* 左側：日曆與時段選擇 */}
                        <div className="bg-white p-6 rounded-3xl shadow-cute cute-border flex flex-col h-full relative">
                            {isAdmin && <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-500 text-white px-4 py-1 rounded-full text-xs font-bold shadow-lg z-10">🛠️ 管理員模式啟用中</div>}
                            
                            <div className="flex justify-between items-center mb-6 mt-2">
                                <button onClick={() => handleDateChange(-1)} className="p-2 bg-ins-pink rounded-full text-ins-darkPurple hover:bg-pink-200 transition">◀</button>
                                
                                <div className="relative group flex items-center justify-center cursor-pointer">
                                    <h2 className="text-2xl font-bold text-ins-text group-hover:text-ins-accent transition-colors">{selectedDate}</h2>
                                    <input 
                                        type="date" 
                                        value={selectedDate} 
                                        onChange={(e) => {
                                            if(e.target.value) setSelectedDate(e.target.value);
                                        }} 
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                    />
                                    <div className="absolute -bottom-5 text-[10px] text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-medium pointer-events-none">點擊更改日期</div>
                                </div>
                                
                                <button onClick={() => handleDateChange(1)} className="p-2 bg-ins-pink rounded-full text-ins-darkPurple hover:bg-pink-200 transition">▶</button>
                            </div>

                            <div className="mb-4 text-sm text-center flex justify-center gap-4 text-gray-600">
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-white border border-ins-darkPurple rounded-full"></div> 開放</span>
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-gray-300 rounded-full"></div> 已預約</span>
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-pink-200 rounded-full"></div> 不開放</span>
                            </div>

                            <div className="grid grid-cols-4 gap-2 flex-grow overflow-y-auto pr-1 pb-2">
                                {Array.from({ length: 24 }).map((_, h) => {
                                    const slotStr = getSlotString(new Date(`${selectedDate}T00:00:00`), h);
                                    const bookingRecord = bookedSlotsMap[slotStr];
                                    const isBooked = !!bookingRecord;
                                    const isCompleted = bookingRecord?.status === 'completed';
                                    const isUnavailable = unavailables.includes(slotStr) || !!bufferSlotsMap[slotStr];
                                    
                                    let isSelected = false;
                                    if (!isAdmin && bookingStartData !== null) {
                                        const slotTimestamp = new Date(`${selectedDate}T00:00:00`).getTime() + h * 3600000;
                                        const startTimestamp = new Date(`${bookingStartData.date}T00:00:00`).getTime() + bookingStartData.hour * 3600000;
                                        const endTimestamp = startTimestamp + totalHours * 3600000;
                                        if (slotTimestamp >= startTimestamp && slotTimestamp < endTimestamp) isSelected = true;
                                    }

                                    let btnClass = "py-3 rounded-xl font-bold text-sm transition-all ";
                                    if (isSelected) {
                                        btnClass += "bg-ins-darkPurple text-white shadow-lg scale-105";
                                    } else if (isBooked) {
                                        if (isCompleted) {
                                            btnClass += "bg-gray-200 text-gray-500 border border-gray-300 ";
                                            if (isAdmin) btnClass += "hover:bg-red-100 hover:text-red-500 cursor-pointer ";
                                            else btnClass += "cursor-not-allowed ";
                                        } else {
                                            btnClass += "bg-gray-100 text-gray-400 border border-gray-200 stripe-pattern ";
                                            if (isAdmin) btnClass += "hover:bg-red-100 hover:text-red-500 cursor-pointer border-red-300 ";
                                            else btnClass += "cursor-not-allowed ";
                                        }
                                    } else if (isUnavailable) {
                                        btnClass += "bg-pink-100 text-pink-400 border border-pink-200 ";
                                        if (isAdmin) btnClass += "hover:bg-green-50 cursor-pointer border-green-200";
                                        else btnClass += "cursor-not-allowed ";
                                    } else {
                                        btnClass += "bg-white border-2 border-ins-purple text-ins-darkPurple hover:bg-ins-purple cursor-pointer hover:-translate-y-1";
                                    }

                                    return <button key={h} onClick={() => handleSlotClick(h)} className={btnClass}>{String(h).padStart(2, '0')}:00</button>;

                                setMembers(updatedMembers);
                                setLocalData('cute_calendar_members', updatedMembers);

                                const updatedBookings = bookings.map(bk => bk.id === b.id ? { ...bk, status: 'confirmed' } : bk);
                                setBookings(updatedBookings);
                                setLocalData('cute_calendar_bookings', updatedBookings);

                                if (db && window.FirebaseLib) {
                                    const { doc, setDoc, updateDoc } = window.FirebaseLib;
                                    await setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { twitter: handle, bookingCount: newCount }, { merge: true });
                                    await updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' });
                                }
                                setSelectedAdminBooking(null);
                                showModal('撤銷成功', `已取消完成標記，@${handle} 的次數已還原。`);
                            } catch(e) { showModal('撤銷成功', `已取消標記！`); }
                        }}
                        onCancelBooking={async (b) => {
                            try {
                                const updatedBookings = bookings.filter(bk => bk.id !== b.id);
                                setBookings(updatedBookings);
                                setLocalData('cute_calendar_bookings', updatedBookings);

                                if (db && window.FirebaseLib) {
                                    const { doc, deleteDoc } = window.FirebaseLib;
                                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id));
                                }
                                setSelectedAdminBooking(null);
                                showModal('已刪除', '已取消該預約並釋出時段！');
                            } catch(e) { showModal('已刪除', '已取消該預約並釋出時段！'); }
                        }}
                    />

                    <CustomerHistoryModal
                        isOpen={showHistoryModal}
                        history={customerHistory}
                        onClose={() => setShowHistoryModal(false)}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal}
                        members={members}
                        onClose={() => setShowMembersModal(false)}
                        onToggleBlacklist={async (handle, currentStatus) => {
                            try { 
                                const updatedMembers = { ...members, [handle]: { ...members[handle], isBlacklisted: !currentStatus } };
                                setMembers(updatedMembers);
                                setLocalData('cute_calendar_members', updatedMembers);

                                if (db && window.FirebaseLib) {
                                    const { doc, setDoc } = window.FirebaseLib;
                                    await setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { isBlacklisted: !currentStatus }, { merge: true }); 
                                }
                            } catch(e) { console.error(e); }
                        }}
                    />

                    {modalConfig.isImage ? (
                        <ImageModal 
                            isOpen={modalConfig.isOpen} 
                            title={modalConfig.title} 
                            imageUrl={modalConfig.url} 
                            onClose={closeModal} 
                        />
                    ) : (
                        <Modal isOpen={modalConfig.isOpen} title={modalConfig.title} message={modalConfig.message} onClose={closeModal} />
                    )}

                    <ImageModal 
                        isOpen={showRulesModal}
                        title="📜 約會規則與注意事項"
                        imageUrl="rules.PNG"
                        onClose={() => setShowRulesModal(false)}
                    />
                </div>
            );
        };

        // 安全掛載 React
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
