<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小屁孩的純約會行事曆～</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'] },
                    colors: { cream: { bg: '#FAF5EF', text: '#382E2B', subtext: '#7A6E65' } }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; background-color: #FAF5EF;
            background-image: radial-gradient(#E2D6C8 1.2px, transparent 1.2px);
            background-size: 24px 24px; color: #382E2B;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden; position: relative;
        }
        .cloud-card { position: relative; z-index: 1; padding: 32px 24px; margin: 18px 12px; }
        .cloud-card::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FFFFFF; border: 12px solid #E3D1BF; border-radius: 40px;
            filter: url(#cloud-wave-filter); box-shadow: 0 12px 25px rgba(180, 150, 130, 0.15);
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); will-change: filter;
        }
        .cloud-vip-card { position: relative; z-index: 1; padding: 22px 18px; margin-top: 16px; }
        .cloud-vip-card::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FDF4E8; border: 6px solid #E3D1BF; border-radius: 28px;
            filter: url(#cloud-wave-filter); -webkit-backface-visibility: hidden; backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); will-change: filter;
        }
        .foam-shape { border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px !important; }
        .mild-wave-bg {
            position: absolute; inset: 0; z-index: -1; filter: url(#mild-wave-filter);
            border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px; transition: all 0.2s ease;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
        }
        .wavy-input-group { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; }
        .wavy-input-group::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FAF7F2; border: 2px solid #EAE1D7;
            border-radius: 26px 20px 24px 22px / 20px 26px 22px 24px;
            filter: url(#mild-wave-filter); transition: all 0.2s ease;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
        }
        .wavy-input-group:focus-within::before {
            background-color: #FFFFFF; border-color: #C89B7B; box-shadow: 0 0 0 4px rgba(200, 155, 123, 0.12);
        }
        .wavy-input-group input, .wavy-input-group select, .wavy-input-group textarea {
            width: 100%; background: transparent; border: none; outline: none; color: #382E2B;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4B392; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #C89B7B; }
        .stripe-pattern { background: repeating-linear-gradient(45deg, #F5EFE8, #F5EFE8 10px, #EAE2D8 10px, #EAE2D8 20px); }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0.7); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(216, 136, 112, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0); }
        }
        .pulse-badge { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #8C5E3C; font-size: 16px;">載入中... ☕</div>
    </div>

    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; left: -9999px; top: -9999px; pointer-events: none;" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <defs>
            <filter id="cloud-wave-filter" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="mild-wave-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <script type="module">
        try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            window.FirebaseLib = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc };
            window.dispatchEvent(new Event('firebaseready'));
        } catch(e) { console.warn("Firebase Async Load Skip"); }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const _h = (s) => { let h = 0; for(let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0; return h; };

        const memoryStorage = {};
        const getLocalData = (key, defaultVal) => {
            try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : defaultVal; }
            catch (e) { return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal; }
        };
        const setLocalData = (key, val) => {
            try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) { memoryStorage[key] = val; }
        };

        const thsrFares = {
            "南港": 0, "台北": 0, "新北": 0, "桃園": 125, "新竹": 250, "苗栗": 385,
            "台中": 645, "彰化": 765, "雲林": 870, "嘉義": 1015, "台南": 1280, "高雄": 1415
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) slots.push(getSlotString(baseDate, i));
            return slots;
        };

        const isSystemUnavailable = (slotStr) => {
            const parts = slotStr.split('_');
            if (parts.length !== 2) return false;
            const slotDate = new Date(`${parts[0]}T00:00:00`);
            const hour = parseInt(parts[1], 10);
            if (slotDate >= new Date('2027-01-04T00:00:00')) return false;
            const day = slotDate.getDay();
            if ((day === 2 || day === 3) && (hour >= 8 && hour < 12)) return true;
            if ((day === 2 || day === 4) && (hour >= 15 && hour < 20)) return true;
            if (day === 5 && (hour >= 13 && hour < 20)) return true;
            return false;
        };

        const deduplicateBookings = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();
            list.forEach(item => {
                if (!item) return;
                const key = item.id || `${item.twitter}_${item.date}_${item.startHour}_${item.duration}`;
                let dupKey = null;
                for (let [k, ex] of map.entries()) {
                    if (ex.id === item.id || (ex.twitter === item.twitter && ex.date === item.date && ex.startHour === item.startHour && ex.duration === item.duration)) {
                        dupKey = k; break;
                    }
                }
                if (dupKey) {
                    const ex = map.get(dupKey);
                    if (item.status === 'confirmed' || item.status === 'completed' || !ex.status) { map.delete(dupKey); map.set(key, item); }
                } else map.set(key, item);
            });
            return Array.from(map.values());
        };

        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0, extraHours = 0, midnightCount = 0, midnightSurcharge = 0;
            const BASE_HR = 1000;
            if (planType === 'overnight' && isVip) {
                basePrice = (Math.floor(duration / 24) * 18000) + ((duration % 24) * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2);
                if (duration >= 12) basePrice *= 0.8;
            } else {
                if (isVip) {
                    basePrice = duration >= 12 ? duration * 660 : duration >= 6 ? duration * 750 : duration * 800;
                } else {
                    if (duration >= 12) { basePrice = 8800; extraHours = duration - 12; }
                    else if (duration >= 6) { basePrice = 5200; extraHours = duration - 6; }
                    else if (duration >= 4) { basePrice = duration * BASE_HR * 0.9; }
                    else { basePrice = duration * BASE_HR; }
                    if (extraHours > 0) basePrice += extraHours * (BASE_HR * 0.9);
                }
                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) midnightCount++;
                }
                if (midnightCount > 0) {
                    midnightSurcharge = isVip ? midnightCount * (BASE_HR - (basePrice / duration)) : midnightCount * (BASE_HR * 0.2);
                }
            }
            return { total: Math.round(basePrice + midnightSurcharge), basePrice: Math.round(basePrice), midnightSurcharge: Math.round(midnightSurcharge), midnightCount, isVip };
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-extrabold text-[#382E2B] mb-2">{title}</h3>
                        <p className="text-[#7A6E65] mb-6 whitespace-pre-line text-sm leading-relaxed">{message}</p>
                        <button onClick={onClose} className="foam-shape w-full py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">知道啦 ☕</button>
                    </div>
                </div>
            );
        };

        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);
            useEffect(() => { setCurrentUrl(encodeURI(imageUrl)); setHasError(false); }, [imageUrl]);
            const handleImgError = () => {
                if (currentUrl.endsWith('.PNG')) setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                else if (currentUrl.endsWith('.png')) setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                else setHasError(true);
            };
            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-md border border-[#EAE1D7] flex flex-col max-h-[90vh] shadow-2xl">
                        <h3 className="text-lg font-bold text-[#382E2B] mb-3 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-2xl border border-[#EAE1D7] flex items-center justify-center bg-[#FAF7F2] relative p-2">
                            {!hasError ? (<img src={currentUrl} alt={title} className="w-full h-auto object-contain rounded-xl" onError={handleImgError} />)
                            : (<div className="text-center p-6 bg-[#FAF4EB] rounded-2xl w-full"><p className="text-[#B8735C] font-bold mb-2">無法載入圖片 🥺</p></div>)}
                        </div>
                        <button onClick={onClose} className="foam-shape w-full mt-4 py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">我已詳閱並了解 ☕</button>
                    </div>
                </div>
            );
        };

        const AdminPendingModal = ({ isOpen, pendingBookings, onClose, onApprove, onReject }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">待審核預約 ({pendingBookings.length})</h3>
                        {pendingBookings.length === 0 ? <p className="text-center text-[#7A6E65]">目前沒有新預約。</p> : pendingBookings.map(b => (
                            <div key={b.id} className="border border-[#E7D4BF] p-3 mb-3 rounded-xl bg-[#FAF4EB]">
                                <p className="font-bold text-[#382E2B]">@{b.twitter}</p>
                                <p className="text-sm text-[#7A6E65]">{b.date} {String(b.startHour).padStart(2, '0')}:00 ({b.duration}h)</p>
                                <div className="flex gap-2 mt-3">
                                    <button onClick={() => onApprove(b)} className="flex-1 bg-[#849B89] text-white py-1.5 rounded-lg font-bold shadow-sm">核準</button>
                                    <button onClick={() => onReject(b)} className="flex-1 bg-[#D98880] text-white py-1.5 rounded-lg font-bold shadow-sm">拒絕</button>
                                </div>
                            </div>
                        ))}
                        <button onClick={onClose} className="w-full mt-2 py-2 bg-[#EAE1D7] text-[#382E2B] font-bold rounded-xl shadow-sm">關閉</button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, onClose, onConfirmEnd, onRevertComplete, onCancelBooking }) => {
            if (!isOpen || !booking) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">管理預約</h3>
                        <p className="font-bold text-[#382E2B]">@{booking.twitter}</p>
                        <p className="text-sm text-[#7A6E65] mb-4">{booking.date} {String(booking.startHour).padStart(2, '0')}:00</p>
                        <div className="flex flex-col gap-2">
                            {booking.status !== 'completed' && <button onClick={() => onConfirmEnd(booking)} className="bg-[#849B89] text-white py-2 rounded-xl font-bold shadow-sm">標記為已完成 (累積 1 次)</button>}
                            {booking.status === 'completed' && <button onClick={() => onRevertComplete(booking)} className="bg-[#C89B7B] text-white py-2 rounded-xl font-bold shadow-sm">撤銷完成狀態</button>}
                            <button onClick={() => onCancelBooking(booking)} className="bg-[#D98880] text-white py-2 rounded-xl font-bold shadow-sm">刪除此預約 (釋出時段)</button>
                            <button onClick={onClose} className="bg-[#EAE1D7] text-[#382E2B] py-2 rounded-xl font-bold mt-2 shadow-sm">關閉</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminMembersModal = ({ isOpen, members, onClose, onToggleBlacklist }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">會員管理</h3>
                        {Object.values(members).length === 0 ? <p className="text-[#7A6E65] text-center">尚無會員資料</p> : Object.values(members).map(m => (
                            <div key={m.twitter} className="border border-[#E7D4BF] p-3 mb-2 flex justify-between items-center rounded-xl bg-[#FAF4EB]">
                                <span className="font-bold text-[#382E2B]">@{m.twitter}</span>
                                <button onClick={() => onToggleBlacklist(m.twitter, m.isBlacklisted)} className={`px-3 py-1.5 rounded-lg text-xs font-bold text-white shadow-sm ${m.isBlacklisted ? 'bg-[#849B89]' : 'bg-[#D98880]'}`}>
                                    {m.isBlacklisted ? '解除黑名單' : '加入黑名單'}
                                </button>
                            </div>
                        ))}
                        <button onClick={onClose} className="w-full mt-4 py-2 bg-[#EAE1D7] text-[#382E2B] font-bold rounded-xl shadow-sm">關閉</button>
                    </div>
                </div>
            );
        };

        const CustomerHistoryModal = ({ isOpen, history, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">歷史約會紀錄</h3>
                        {history.length === 0 ? <p className="text-[#7A6E65] text-center">尚無完成的約會紀錄</p> : history.map((h, i) => (
                            <div key={i} className="border border-[#E7D4BF] p-3 mb-2 rounded-xl bg-[#FAF4EB]">
                                <p className="font-bold text-[#382E2B]">{h.date}</p>
                                <p className="text-sm text-[#7A6E65]">{String(h.startHour).padStart(2, '0')}:00 開始 (共 {h.duration} 小時)</p>
                            </div>
                        ))}
                        <button onClick={onClose} className="w-full mt-4 py-2 bg-[#EAE1D7] text-[#382E2B] font-bold rounded-xl shadow-sm">關閉</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'cute-dating-calendar-v1';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyBvW3x4X8_dummy_key", authDomain: `${appId}.firebaseapp.com`, projectId: appId, storageBucket: `${appId}.appspot.com`,
            };

            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [bookings, setBookings] = useState([]);
            const [unavailables, setUnavailables] = useState([]);
            const [members, setMembers] = useState({});

            const [selectedDate, setSelectedDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [bookingStartData, setBookingStartData] = useState(null);
            const [selectedDays, setSelectedDays] = useState(0);
            const [selectedDuration, setSelectedDuration] = useState(2);
            const [twitterHandle, setTwitterHandle] = useState('');
            const [planType, setPlanType] = useState('normal');
            const [itinerary, setItinerary] = useState('');
            const [bankAccountLast5, setBankAccountLast5] = useState('');
            const [location, setLocation] = useState('新北');
            const [transportation, setTransportation] = useState('大眾交通');

            // 暫時性同次點擊記憶（關掉網頁即清空，不影響其他用戶）
            const [lastUserDemand, setLastUserDemand] = useState('');
            const [lastGeneratedText, setLastGeneratedText] = useState('');
            const [pastRecommendations, setPastRecommendations] = useState([]);

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPwd, setAdminPwd] = useState('');
            const [showMembersModal, setShowMembersModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [showRulesModal, setShowRulesModal] = useState(false);
            const [showPendingModal, setShowPendingModal] = useState(false);
            const [selectedAdminBooking, setSelectedAdminBooking] = useState(null);

            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '' });
            const [isGeneratingItinerary, setIsGeneratingItinerary] = useState(false);
            const [bookingSuccessData, setBookingSuccessData] = useState(null);
            const [pendingBookingPayload, setPendingBookingPayload] = useState(null);
            const [isCopied, setIsCopied] = useState(false);

            const showModal = (title, message) => setModalConfig({ isOpen: true, title, message });
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false });

            const totalHours = useMemo(() => planType === 'overnight' ? (selectedDays * 24) + selectedDuration : selectedDuration, [planType, selectedDays, selectedDuration]);

            useEffect(() => {
                if (planType !== 'overnight') {
                    setSelectedDays(0);
                    if (selectedDuration < 2) setSelectedDuration(2);
                    if (planType === 'normal' && selectedDuration > 18) setSelectedDuration(18);
                } else {
                    if (selectedDays === 0) setSelectedDays(1);
                    setSelectedDuration(0);
                }
            }, [planType]);

            const travelFee = useMemo(() => transportation === '召喚小屁孩至外縣市約會（需收取車馬費）' ? (thsrFares[location] || 0) * 2 : 0, [location, transportation]);
            const depositAmount = useMemo(() => {
                let baseDeposit = (totalHours >= 12 || planType === 'overnight') ? 2000 : totalHours >= 6 ? 1000 : 500;
                return baseDeposit + travelFee;
            }, [totalHours, planType, travelFee]);

            // =========================================================================
            // 🚀 雙核心自動切換 AI 行程推薦引擎 (免填金鑰！預覽與 GitHub 100% 雙通且格式一致)
            // =========================================================================
            const handleAIGenerateItinerary = async () => {
                if (!bookingStartData) {
                    showModal('等一下下唷 ☕', '請先在左側月曆上點選「約會開始時間」，AI 顧問才能根據您的時段為您量身規劃唷！');
                    return;
                }

                                <div className="flex gap-2">
                                    <button onClick={() => { setShowAdminLogin(false); setAdminPwd(''); }} className="foam-shape w-1/2 py-2.5 bg-[#EAE1D7] text-[#382E2B] font-bold text-xs">取消</button>
                                    <button onClick={() => { if (_h(adminPwd) === 1538181) { setIsAdmin(true); setShowAdminLogin(false); setAdminPwd(''); } else { showModal('錯誤', '密碼錯誤！'); setAdminPwd(''); } }} className="foam-shape w-1/2 py-2.5 bg-[#C89B7B] text-white font-bold text-xs">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <AdminPendingModal
                        isOpen={showPendingModal} pendingBookings={pendingBookings} onRefresh={syncAllData} onClose={() => setShowPendingModal(false)}
                        onApprove={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                            showModal('審核通過 ✨', `已同意 @${b.twitter} 的約會！該時段已在行事曆鎖定為灰底。`);
                        }}
                        onReject={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                            showModal('已拒絕', `已退回 @${b.twitter} 的預約申請。`);
                        }}
                    />

                    <AdminBookingModal
                        isOpen={!!selectedAdminBooking} booking={selectedAdminBooking} onClose={() => setSelectedAdminBooking(null)}
                        onConfirmEnd={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'completed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'completed' }).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('標記成功 🎉', `已將 @${b.twitter} 的此筆約會標記為「已完成」！(次數計入 1 次)`);
                        }}
                        onRevertComplete={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('已撤銷', `已將約會狀態恢復為「已核準」。`);
                        }}
                        onCancelBooking={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('已刪除', '已取消該預約並釋出時段！');
                        }}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal} members={members} bookings={bookings} onClose={() => setShowMembersModal(false)}
                        onToggleBlacklist={(handle, currentStatus) => {
                            const updatedMembers = { ...members, [handle]: { ...members[handle], isBlacklisted: !currentStatus } };
                            setMembers(updatedMembers); setLocalData('cute_calendar_members', updatedMembers);
                            if (db && window.FirebaseLib) window.FirebaseLib.setDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/members`, handle), { isBlacklisted: !currentStatus }, { merge: true }).catch(e => console.warn(e));
                        }}
                    />

                    <CustomerHistoryModal isOpen={showHistoryModal} history={customerHistory} onClose={() => setShowHistoryModal(false)} />
                    <ImageModal isOpen={showRulesModal} title="約會規則與細則詳閱" imageUrl="rules.PNG" onClose={() => setShowRulesModal(false)} />
                    <Modal isOpen={modalConfig.isOpen} title={modalConfig.title} message={modalConfig.message} onClose={closeModal} />
                </div>
            );
        };

        try { ReactDOM.createRoot(document.getElementById('root')).render(<App />); }
        catch(e) { console.error("React Render Error:", e); }
    </script>
</body>
</html>
