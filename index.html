<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小屁孩的純約會行事曆～</title>
    
    <!-- 引入字體：圓潤可愛風格 -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        ins: {
                            pink: '#fdf2f8',
                            purple: '#f3e8ff',
                            darkPurple: '#a855f7',
                            text: '#4a044e',
                            accent: '#f472b6'
                        }
                    },
                    boxShadow: {
                        'cute': '0 10px 25px -5px rgba(244, 114, 182, 0.3)',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 24px 24px;
            color: #4a044e;
        }
        .cute-border {
            border: 3px dashed #fbcfe8;
            border-radius: 24px;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f472b6; 
        }
        .stripe-pattern {
            background: repeating-linear-gradient(
                45deg,
                #f3f4f6,
                #f3f4f6 10px,
                #e5e7eb 10px,
                #e5e7eb 20px
            );
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase 載入與全域綁定 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        window.FirebaseLib = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
            getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc
        };
    </script>

    <!-- React 主應用程式 -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // 本地快取備份 Helper (防止 GitHub Pages 沒有 Firebase 金鑰時死卡)
        const getLocalData = (key, defaultVal) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultVal;
            } catch (e) { return defaultVal; }
        };

        const setLocalData = (key, val) => {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
        };

        // 高鐵車馬費表 (以板橋/台北為出發基準，單程)
        const thsrFares = {
            "南港": 0, "台北": 0, "板橋": 0,
            "桃園": 125,
            "新竹": 250,
            "苗栗": 385,
            "台中": 645,
            "彰化": 765,
            "雲林": 870,
            "嘉義": 1015,
            "台南": 1280,
            "左營": 1415
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            return `${y}-${m}-${day}_${h}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) {
                slots.push(getSlotString(baseDate, i));
            }
            return slots;
        };

        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0;
            let extraHours = 0;
            const BASE_HR = 1000;
            let midnightCount = 0;
            let midnightSurcharge = 0;

            if (planType === 'overnight' && isVip) {
                const days = Math.floor(duration / 24);
                const remHours = duration % 24;
                basePrice = (days * 18000) + (remHours * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2); 
                if (duration >= 12) {
                    basePrice = basePrice * 0.8; 
                }
            } else {
                if (isVip) {
                    if (duration >= 12) {
                        basePrice = duration * 660;
                    } else if (duration >= 6) {
                        basePrice = duration * 750;
                    } else {
                        basePrice = duration * 800;
                    }
                } else {
                    if (duration >= 12) {
                        basePrice = 8800;
                        extraHours = duration - 12;
                    } else if (duration >= 6) {
                        basePrice = 5200;
                        extraHours = duration - 6;
                    } else if (duration >= 4) {
                        basePrice = duration * BASE_HR * 0.9;
                    } else {
                        basePrice = duration * BASE_HR;
                    }

                    if (extraHours > 0) {
                        basePrice += extraHours * (BASE_HR * 0.9);
                    }
                }

                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) { 
                        midnightCount++;
                    }
                }
                
                if (midnightCount > 0) {
                    if (isVip) {
                        const effectiveRate = basePrice / duration;
                        midnightSurcharge = midnightCount * (BASE_HR - effectiveRate);
                    } else {
                        midnightSurcharge = midnightCount * (BASE_HR * 0.2); 
                    }
                }
            }

            return {
                total: Math.round(basePrice + midnightSurcharge),
                basePrice: Math.round(basePrice),
                midnightSurcharge: Math.round(midnightSurcharge),
                midnightCount,
                isVip
            };
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-pink transform transition-all text-center">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-2">{title}</h3>
                        <p className="text-ins-text mb-6 whitespace-pre-line">{message}</p>
                        <button onClick={onClose} className="w-full py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            知道啦！💕
                        </button>
                    </div>
                </div>
            );
        };

        // 相容大小寫 .PNG 與 .png 的圖片彈窗
        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);

            useEffect(() => {
                setCurrentUrl(encodeURI(imageUrl));
                setHasError(false);
            }, [imageUrl]);

            const handleImgError = () => {
                // 如果是小寫 .png 失敗試試大寫 .PNG，反之亦然
                if (currentUrl.endsWith('.png')) {
                    setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                } else if (currentUrl.endsWith('.PNG')) {
                    setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                } else {
                    setHasError(true);
                }
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-4 w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
                        <h3 className="text-lg font-bold text-ins-darkPurple mb-2 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-xl border border-pink-100 flex items-center justify-center bg-gray-50 relative p-2">
                            {!hasError ? (
                                <img 
                                    src={currentUrl} 
                                    alt={title} 
                                    className="w-full h-auto object-contain rounded-lg" 
                                    onError={handleImgError}
                                />
                            ) : (
                                <div className="text-center p-6 bg-pink-50 rounded-xl w-full">
                                    <p className="text-red-500 font-bold mb-2">無法載入圖片 🥺</p>
                                    <p className="text-sm text-gray-600 mb-2">請確認 GitHub 專案中已上傳該圖片：</p>
                                    <p className="text-xs font-bold text-ins-darkPurple break-all bg-white p-2 rounded border border-pink-200 mb-2">{imageUrl}</p>
                                </div>
                            )}
                        </div>
                        <button onClick={onClose} className="w-full mt-4 py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            我已詳閱並了解 💕
                        </button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, onConfirmEnd, onRevertComplete, onCancelBooking, onClose }) => {
            if (!isOpen || !booking) return null;
            const isCompleted = booking.status === 'completed';
            
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-purple transform transition-all text-center">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4">預約審核管理</h3>
                        {isCompleted && <div className="text-green-600 font-bold mb-3 border-2 border-green-200 bg-green-50 rounded-lg p-2">✅ 此約會已標記為完成</div>}
                        
                        <div className="text-left bg-gray-50 p-4 rounded-xl text-sm mb-6 border border-gray-200 overflow-y-auto max-h-48">
                            <p className="mb-1"><strong>帳號：</strong>@{booking.twitter}</p>
                            <p className="mb-1"><strong>日期：</strong>{booking.date}</p>
                            <p className="mb-1"><strong>時間：</strong>{booking.startHour}:00 ({booking.duration}小時)</p>
                            <p className="mb-1"><strong>方案：</strong>{booking.planType === 'overnight' ? '過夜之旅' : booking.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                            <p className="mb-1"><strong>地點/交通：</strong>{booking.location} / {booking.transportation}</p>
                            {booking.travelFee > 0 && <p className="mb-1 text-red-500"><strong>車馬費：</strong>${booking.travelFee}</p>}
                            <p><strong>行程：</strong>{booking.itinerary}</p>
                        </div>
                        
                        <div className="flex flex-col gap-3">
                            {!isCompleted ? (
                                <button onClick={() => onConfirmEnd(booking)} className="w-full py-3 bg-[#00B900] text-white font-bold rounded-xl shadow-md hover:bg-green-600 transition-colors">
                                    ✅ 標記約會成功完成 (次數+1)
                                </button>
                            ) : (
                                <button onClick={() => onRevertComplete(booking)} className="w-full py-3 bg-yellow-500 text-white font-bold rounded-xl shadow-md hover:bg-yellow-600 transition-colors">
                                    ↩️ 撤銷完成標記 (恢復為已預約)
                                </button>
                            )}
                            <button onClick={() => onCancelBooking(booking)} className="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-md hover:bg-red-600 transition-colors">
                                🗑️ 取消並刪除此預約 (釋出時段)
                            </button>
                            <button onClick={onClose} className="w-full py-2 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-colors">
                                返回
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CustomerHistoryModal = ({ isOpen, history, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-cute border-2 border-ins-pink transform transition-all flex flex-col max-h-[80vh]">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4 text-center">📜 過往約會紀錄</h3>
                        <p className="text-xs text-gray-500 mb-3 text-center">以下是您已經成功被標記為完成的約會💕</p>
                        <div className="overflow-y-auto flex-grow mb-4">
                            {history.length === 0 ? (
                                <p className="text-center text-gray-500 text-sm py-4">目前還沒有已完成的紀錄唷！</p>
                            ) : (
                                history.map(b => (
                                    <div key={b.id} className="bg-pink-50 p-4 rounded-xl mb-3 border border-pink-200 text-sm shadow-sm relative">
                                        <div className="absolute top-3 right-3 text-green-600 font-bold text-xs flex items-center gap-1 bg-green-100 px-2 py-1 rounded-md">
                                            <span>✅</span> 已確認
                                        </div>
                                        <p className="font-bold text-ins-darkPurple text-base mb-1">{b.date}</p>
                                        <p className="text-gray-700 font-medium mb-1">方案：{b.planType === 'overnight' ? '過夜之旅' : b.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                                        <p className="text-gray-600">時長：{b.duration} 小時</p>
                                    </div>
                                ))
                            )}
                        </div>
                        <button onClick={onClose} className="w-full py-3 bg-ins-accent text-white font-bold rounded-xl hover:bg-pink-500 transition-colors shadow-md">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const AdminMembersModal = ({ isOpen, members, onClose, onToggleBlacklist }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-cute border-2 border-ins-purple transform transition-all flex flex-col max-h-[80vh]">
                        <h3 className="text-xl font-bold text-ins-darkPurple mb-4 text-center">👥 會員與黑名單管理</h3>
                        
                        <div className="overflow-y-auto flex-grow mb-4">
                            {Object.entries(members).map(([handle, data]) => (
                                <div key={handle} className={`flex justify-between items-center p-3 mb-2 rounded-xl border ${data.isBlacklisted ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'}`}>
                                    <div>
                                        <span className="font-bold text-ins-darkPurple">@{handle}</span>
                                        <span className="text-xs text-gray-500 ml-2">完成次數: {data.bookingCount || 0}</span>
                                    </div>
                                    <button 
                                        onClick={() => onToggleBlacklist(handle, data.isBlacklisted)}
                                        className={`text-xs px-3 py-1 rounded-full font-bold transition-colors ${data.isBlacklisted ? 'bg-gray-200 text-gray-700 hover:bg-gray-300' : 'bg-red-100 text-red-500 hover:bg-red-500 hover:text-white'}`}
                                    >
                                        {data.isBlacklisted ? '解除黑名單' : '加入黑名單'}
                                    </button>
                                </div>
                            ))}
                            {Object.keys(members).length === 0 && (
                                <p className="text-center text-gray-500 text-sm py-4">尚無會員資料</p>
                            )}
                        </div>

                        <button onClick={onClose} className="w-full py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-colors">
                            關閉
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'cute-dating-calendar-v1';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "dummy-project" };

            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            
            const [bookings, setBookings] = useState([]);
            const [unavailables, setUnavailables] = useState([]);
            const [members, setMembers] = useState({});

            const [selectedDate, setSelectedDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [bookingStartData, setBookingStartData] = useState(null); 
            
            const [selectedDays, setSelectedDays] = useState(0);
            const [selectedDuration, setSelectedDuration] = useState(2); 
            const [twitterHandle, setTwitterHandle] = useState('');
            const [planType, setPlanType] = useState('normal');
            const [itinerary, setItinerary] = useState('');
            const [bankAccountLast5, setBankAccountLast5] = useState('');
            
            const [location, setLocation] = useState('板橋');
            const [transportation, setTransportation] = useState('大眾交通');

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPwd, setAdminPwd] = useState('');
            const [showMembersModal, setShowMembersModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [showRulesModal, setShowRulesModal] = useState(false);
            const [selectedAdminBooking, setSelectedAdminBooking] = useState(null);
            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '' });
            const [isGeneratingItinerary, setIsGeneratingItinerary] = useState(false);
            
            const [bookingSuccessData, setBookingSuccessData] = useState(null);
            const [pendingBookingPayload, setPendingBookingPayload] = useState(null);
            const [isFinalized, setIsFinalized] = useState(false);

            const showModal = (title, message) => setModalConfig({ isOpen: true, title, message });
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false, isImage: false });

            const totalHours = useMemo(() => {
                if (planType === 'overnight') {
                    return (selectedDays * 24) + selectedDuration;
                }
                return selectedDuration;
            }, [planType, selectedDays, selectedDuration]);

            useEffect(() => {
                if (planType !== 'overnight') {
                    setSelectedDays(0);
                    if (selectedDuration < 2) setSelectedDuration(2);
                    if (planType === 'normal' && selectedDuration > 18) {
                        setSelectedDuration(18);
                    }
                } else {
                    if (selectedDays === 0) setSelectedDays(1);
                    setSelectedDuration(0);
                }
            }, [planType]);

            const travelFee = useMemo(() => {
                if (transportation === '召喚小屁孩至外縣市約會（需收取車馬費）') {
                    const singleFare = thsrFares[location] || 0;
                    return singleFare * 2;
                }
                return 0;
            }, [location, transportation]);

            const depositAmount = useMemo(() => {
                let baseDeposit = 500;
                if (totalHours >= 12 || planType === 'overnight') baseDeposit = 2000;
                else if (totalHours >= 6) baseDeposit = 1000;
                
                return baseDeposit + travelFee;
            }, [totalHours, planType, travelFee]);

            const handleAIGenerateItinerary = async () => {
                setIsGeneratingItinerary(true);
                try {
                    const systemPrompt = "你是一個專屬的戀愛約會顧問，風格可愛、溫柔、充滿粉紅泡泡。現在有客人要預約純約會，請根據客人的時數與初步想法，發想詳細約會行程表。直接輸出內容，無Markdown。";
                    const userQuery = `時數：${totalHours}小時。\n地點：${location}。\n想法：${itinerary || '給我驚喜！'}`;

                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });

                    const result = await response.json();
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                        setItinerary(result.candidates[0].content.parts[0].text);
                    } else {
                        showModal('哎呀！', 'AI 顧問腦袋打結了，請再試一次唷！🥺');
                    }
                } catch (error) {
                    showModal('哎呀！', '呼叫 AI 顧問失敗了，網路可能有點問題～🥺');
                } finally {
                    setIsGeneratingItinerary(false);
                }
            };

            // 安全防死鎖 Firebase 初始化機制
            useEffect(() => {
                const timer = setTimeout(() => {
                    setAuthLoading(false); // 1 秒安全防護：無論 Firebase 回應與否強制顯示畫面
                }, 1000);

                try {
                    if (window.FirebaseLib && firebaseConfig.apiKey) {
                        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseLib;
                        const appInstance = initializeApp(firebaseConfig);
                        const dbInstance = getFirestore(appInstance);
                        const authInstance = getAuth(appInstance);
                        setDb(dbInstance);

                        signInAnonymously(authInstance).catch(e => console.warn(e));
                        const unsub = onAuthStateChanged(authInstance, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                            clearTimeout(timer);
                        });
                        return () => { unsub(); clearTimeout(timer); };
                    } else {
                        setAuthLoading(false);
                        clearTimeout(timer);
                    }
                } catch (e) {
                    console.warn("Firebase 自動降級至本地快取模式", e);
                    setAuthLoading(false);
                    clearTimeout(timer);
                }
            }, []);

            // 實時資料同步 (含自動本地快取)
            useEffect(() => {
                if (!db || !window.FirebaseLib) {
                    setBookings(getLocalData('cute_calendar_bookings', []));
                    setUnavailables(getLocalData('cute_calendar_unavailables', []));
                    setMembers(getLocalData('cute_calendar_members', {}));
                    return;
                }

                const { collection, query, onSnapshot } = window.FirebaseLib;
                let unsub1, unsub2, unsub3;

                try {
                    unsub1 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/bookings`)), snap => {
                        const b = []; snap.forEach(doc => b.push({ id: doc.id, ...doc.data() })); 
                        setBookings(b);
                        setLocalData('cute_calendar_bookings', b);
                    }, () => setBookings(getLocalData('cute_calendar_bookings', [])));

                    unsub2 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/unavailables`)), snap => {
                        const u = []; snap.forEach(doc => u.push(doc.id)); 
                        setUnavailables(u);
                        setLocalData('cute_calendar_unavailables', u);
                    }, () => setUnavailables(getLocalData('cute_calendar_unavailables', [])));

                    unsub3 = onSnapshot(query(collection(db, `artifacts/${appId}/public/data/members`)), snap => {
                        const m = {}; snap.forEach(doc => { m[doc.id] = doc.data(); }); 
                        setMembers(m);
                        setLocalData('cute_calendar_members', m);
                    }, () => setMembers(getLocalData('cute_calendar_members', {})));
                } catch (e) {
                    setBookings(getLocalData('cute_calendar_bookings', []));
                    setUnavailables(getLocalData('cute_calendar_unavailables', []));
                    setMembers(getLocalData('cute_calendar_members', {}));
                }

                return () => {
                    if (unsub1) unsub1();
                    if (unsub2) unsub2();
                    if (unsub3) unsub3();
                };
            }, [db, user]);

            const bookedSlotsMap = useMemo(() => {
                const map = {};
                bookings.forEach(b => { (b.slots || []).forEach(s => { map[s] = b; }); });
                return map;
            }, [bookings]);

            const bufferSlotsMap = useMemo(() => {
                const map = {};
                bookings.forEach(b => {
                    if (b.date && b.startHour !== undefined && b.duration !== undefined) {
                        const baseDate = new Date(`${b.date}T00:00:00`);
                        map[getSlotString(baseDate, b.startHour - 1)] = true;
                        map[getSlotString(baseDate, b.startHour + b.duration)] = true;
                    }
                });
                return map;
            }, [bookings]);

            const currentMemberData = useMemo(() => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                if (!handle) return null;
                return members[handle];
            }, [twitterHandle, members]);

            const customerHistory = useMemo(() => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                if (!handle) return [];
                return bookings
                    .filter(b => b.twitter === handle && b.status === 'completed')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [bookings, twitterHandle]);

            const isVip = (currentMemberData?.bookingCount || 0) >= 3;
            const isBlacklisted = currentMemberData?.isBlacklisted || false;

            useEffect(() => {
                if (!isVip && planType !== 'normal') setPlanType('normal');
            }, [isVip, planType]);

            const priceInfo = useMemo(() => {
                if (bookingStartData === null) return null;
                return calculatePrice(bookingStartData.hour, totalHours, isVip, planType);
            }, [bookingStartData, totalHours, isVip, planType]);

            const handleDateChange = (offset) => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() + offset);
                setSelectedDate(d.toLocaleDateString('en-CA'));
            };

            const checkSlotsAvailability = (startDate, startH, dur) => {
                const targetSlots = generateSlotsForBooking(startDate, startH, dur);
                for (let s of targetSlots) {
                    if (bookedSlotsMap[s] || unavailables.includes(s) || bufferSlotsMap[s]) return false;
                }
                return true;
            };

            const handleSlotClick = async (hour) => {
                const slotStr = getSlotString(new Date(`${selectedDate}T00:00:00`), hour);
                
                if (isAdmin) {
                    if (bookedSlotsMap[slotStr]) {
                        setSelectedAdminBooking(bookedSlotsMap[slotStr]);
                        return;
                    }
                    try {
                        const newUnav = unavailables.includes(slotStr) 
                            ? unavailables.filter(u => u !== slotStr) 
                            : [...unavailables, slotStr];
                        setUnavailables(newUnav);
                        setLocalData('cute_calendar_unavailables', newUnav);

                        if (db && window.FirebaseLib) {
                            const { doc, setDoc, deleteDoc } = window.FirebaseLib;
                            const docRef = doc(db, `artifacts/${appId}/public/data/unavailables`, slotStr);
                            if (unavailables.includes(slotStr)) await deleteDoc(docRef);
                            else await setDoc(docRef, { markedByAdmin: true });
                        }
                    } catch (e) { console.error(e); }
                    return;
                }

                if (bookedSlotsMap[slotStr] || unavailables.includes(slotStr) || bufferSlotsMap[slotStr]) return; 

                if (checkSlotsAvailability(selectedDate, hour, totalHours)) {
                    setBookingStartData({ date: selectedDate, hour: hour });
                } else {
                    showModal('哎呀！', `您選擇的時數往後推算會遇到不開放時段唷，請重新選擇～🎀`);
                }
            };

            useEffect(() => {
                if (bookingStartData !== null && !isAdmin) {
                    if (!checkSlotsAvailability(bookingStartData.date, bookingStartData.hour, totalHours)) {
                        setBookingStartData(null);
                        showModal('提示', `因為更改了預約時數，原先選擇的時段有衝突，請重新選擇開始時間哦！🎀`);
                    }
                }
            }, [totalHours]);

            const handleBookingSubmit = () => {
                const handle = twitterHandle.trim().replace(/^@/, '').toLowerCase();
                
                if (!handle) return showModal('等一下！', '要填寫推特帳號才能聯繫到你唷～');
                if (isBlacklisted) return showModal('抱歉', '系統無法接受您的預約，若有疑問請聯繫官方客服。');
                if (bookingStartData === null) return showModal('等一下！', '還沒選擇幾點開始約會呢！⏰');
                if (!itinerary.trim()) return showModal('等一下！', '行程細節也要跟我說一下嘛～想去哪裡玩？📝');
                if (!bankAccountLast5 || bankAccountLast5.length < 5) return showModal('等一下！', '請輸入完整的匯款帳號「後五碼」唷！💳');

                if (!checkSlotsAvailability(bookingStartData.date, bookingStartData.hour, totalHours)) {
                    setBookingStartData(null);
                    return showModal('哎呀！', '這個時段剛剛被別人手刀搶走或不開放了，請重選唷！🥲');
                }

                const targetSlots = generateSlotsForBooking(bookingStartData.date, bookingStartData.hour, totalHours);
                const bookingData = {
                    twitter: handle,
                    date: bookingStartData.date,
                    startHour: bookingStartData.hour,
                    duration: totalHours,
                    planType: planType,
                    slots: targetSlots,
                    status: 'pending',
                    location: location,
                    transportation: transportation,
                    travelFee: travelFee,
                    itinerary: itinerary.trim(),
                    priceInfo: priceInfo,
                    createdAt: new Date().toISOString()
                };

                const planName = planType === 'overnight' ? '全日or多日的過夜浪漫之旅' : planType === 'cuddle' ? '純抱抱睡方案' : '一般約會';

                const summary = `【預約確認信💌】
推特帳號：@${handle}
預約日期：${bookingStartData.date}
開始時間：${String(bookingStartData.hour).padStart(2, '0')}:00
預約時數：${totalHours} 小時 ${planType === 'overnight' ? `(${selectedDays}天 ${selectedDuration}小時)` : ''}
預約方案：${planName}
約會地點：${location}
交通方式：${transportation}

費用總計：$${priceInfo.total}
車馬費：$${travelFee}
應繳定金(含車馬)：$${depositAmount}

行程細節：
${itinerary.trim()}

匯款帳號：
台北富邦銀行 (012) 81680004182967
匯款帳號後五碼：${bankAccountLast5}

請確認以上資訊無誤後傳送本訊息！💕`;

                setPendingBookingPayload({ bookingData, handle });
                setBookingSuccessData(summary);
                setIsFinalized(false);
            };

            const goToLine = () => {
                if (!pendingBookingPayload) return;
                const lineUrl = `https://line.me/R/ti/p/@tte0624e?text=${encodeURIComponent(bookingSuccessData)}`;
                window.open(lineUrl, '_blank');
                setIsFinalized(true); 
            };

            const confirmAndSaveBooking = async () => {
                if (!pendingBookingPayload) return;
                
                const { date, startHour, duration } = pendingBookingPayload.bookingData;
                if (!checkSlotsAvailability(date, startHour, duration)) {
                    showModal('哎呀！', '這個時段剛剛被別人搶走了，請重新選擇唷！🥲');
                    resetAllToHome();
                    return;
                }

                try {
                    const newBooking = { id: 'b_' + Date.now(), ...pendingBookingPayload.bookingData };
                    const updatedBookings = [...bookings, newBooking];
                    setBookings(updatedBookings);
                    setLocalData('cute_calendar_bookings', updatedBookings);

                    const updatedMembers = { ...members, [pendingBookingPayload.handle]: { twitter: pendingBookingPayload.handle } };
                    setMembers(updatedMembers);
                    setLocalData('cute_calendar_members', updatedMembers);

                    if (db && window.FirebaseLib) {
                        const { doc, setDoc, collection } = window.FirebaseLib;
                        const newDocRef = doc(collection(db, `artifacts/${appId}/public/data/bookings`));
                        await setDoc(newDocRef, pendingBookingPayload.bookingData);
                        const memberRef = doc(db, `artifacts/${appId}/public/data/members`, pendingBookingPayload.handle);
                        await setDoc(memberRef, { twitter: pendingBookingPayload.handle }, { merge: true });
                    }

                    resetAllToHome();
                    showModal('預約已鎖定！🎉', '時段已經為您正式保留囉！期待我們的約會💕');
                } catch (e) {
                    resetAllToHome();
                    showModal('預約已保留！🎉', '時段已經為您正式保留囉！期待我們的約會💕');
                }

            const resetAllToHome = () => {
                setBookingSuccessData(null);
                setPendingBookingPayload(null);
                setIsFinalized(false);
                setBookingStartData(null);
                setItinerary('');
                setBankAccountLast5('');

            const copyToClipboard = () => {
                navigator.clipboard.writeText(bookingSuccessData).then(() => {
                    alert('已複製確認信文字！請切換至 LINE 手動貼上傳送。');

                        <p className="text-ins-text font-medium mt-2">牽手、逛街、吃飯、看電影... 陪你度過浪漫時光 🎀</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* 左側：日曆與時段選擇 */}
                        <div className="bg-white p-6 rounded-3xl shadow-cute cute-border flex flex-col h-full relative">
                            {isAdmin && <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-500 text-white px-4 py-1 rounded-full text-xs font-bold shadow-lg z-10">🛠️ 管理員模式啟用中</div>}
                            
                            <div className="flex justify-between items-center mb-6 mt-2">
                                <button onClick={() => handleDateChange(-1)} className="p-2 bg-ins-pink rounded-full text-ins-darkPurple hover:bg-pink-200 transition">◀</button>
                                
                                <div className="relative group flex items-center justify-center cursor-pointer">
                                    <h2 className="text-2xl font-bold text-ins-text group-hover:text-ins-accent transition-colors">{selectedDate}</h2>
                                    <input 
                                        type="date" 
                                        value={selectedDate} 
                                        onChange={(e) => {
                                            if(e.target.value) {
                                                setSelectedDate(e.target.value);
                                            }
                                        }} 
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                    />
                                    <div className="absolute -bottom-5 text-[10px] text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-medium pointer-events-none">點擊更改日期</div>
                                </div>
                                
                                <button onClick={() => handleDateChange(1)} className="p-2 bg-ins-pink rounded-full text-ins-darkPurple hover:bg-pink-200 transition">▶</button>
                            </div>

                            <div className="mb-4 text-sm text-center flex justify-center gap-4 text-gray-600">
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-white border border-ins-darkPurple rounded-full"></div> 開放</span>
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-gray-300 rounded-full"></div> 已預約</span>
                                <span className="flex items-center gap-1"><div className="w-3 h-3 bg-pink-200 rounded-full"></div> 不開放</span>
                            </div>

                            <div className="grid grid-cols-4 gap-2 flex-grow overflow-y-auto pr-1 pb-2">
                                {Array.from({ length: 24 }).map((_, h) => {
                                    const slotStr = getSlotString(new Date(`${selectedDate}T00:00:00`), h);
                                    const bookingRecord = bookedSlotsMap[slotStr];
                                    const isBooked = !!bookingRecord;
                                    const isCompleted = bookingRecord?.status === 'completed';
                                    const isUnavailable = unavailables.includes(slotStr) || !!bufferSlotsMap[slotStr];
                                    
                                    let isSelected = false;
                                    if (!isAdmin && bookingStartData !== null) {
                                        const slotTimestamp = new Date(`${selectedDate}T00:00:00`).getTime() + h * 3600000;
                                        const startTimestamp = new Date(`${bookingStartData.date}T00:00:00`).getTime() + bookingStartData.hour * 3600000;
                                        const endTimestamp = startTimestamp + totalHours * 3600000;
                                        
                                        if (slotTimestamp >= startTimestamp && slotTimestamp < endTimestamp) {
                                            isSelected = true;
                                        }
                                    }

                                    let btnClass = "py-3 rounded-xl font-bold text-sm transition-all ";
                                    if (isSelected) {
                                        btnClass += "bg-ins-darkPurple text-white shadow-lg scale-105";
                                    } else if (isBooked) {
                                        if (isCompleted) {
                                            btnClass += "bg-gray-200 text-gray-500 border border-gray-300 ";
                                            if (isAdmin) btnClass += "hover:bg-red-100 hover:text-red-500 cursor-pointer ";
                                            else btnClass += "cursor-not-allowed ";
                                        } else {
                                            btnClass += "bg-gray-100 text-gray-400 border border-gray-200 stripe-pattern ";
                                            if (isAdmin) btnClass += "hover:bg-red-100 hover:text-red-500 cursor-pointer border-red-300 ";
                                            else btnClass += "cursor-not-allowed ";
                                        }
                                    } else if (isUnavailable) {
                                        btnClass += "bg-pink-100 text-pink-400 border border-pink-200 ";
                                        if (isAdmin) btnClass += "hover:bg-green-50 cursor-pointer border-green-200";
                                        else btnClass += "cursor-not-allowed ";
                                    } else {
                                        btnClass += "bg-white border-2 border-ins-purple text-ins-darkPurple hover:bg-ins-purple cursor-pointer hover:-translate-y-1";
                                    }

                                    return <button key={h} onClick={() => handleSlotClick(h)} className={btnClass}>{String(h).padStart(2, '0')}:00</button>;
                                })}
                            </div>
                            {isAdmin && <div className="mt-2 text-xs text-red-500 text-center font-bold">點擊空白處關閉 / 點擊灰色審核約會</div>}
                        </div>

                        {/* 右側：表單與確認畫面 */}
                        {bookingSuccessData ? (
                            isFinalized ? (
                                <div className="bg-white p-8 rounded-3xl shadow-cute border-2 border-green-400 flex flex-col gap-4 text-center justify-center relative">
                                    <h2 className="text-2xl font-bold text-green-600 mb-2">請確認是否送出！💬</h2>
                                    <p className="text-gray-600 text-sm mb-2">如果跳轉 LINE 後沒有自動帶入訊息，請點擊下方按鈕手動複製確認信內容，並貼給官方帳號確認喔！💕</p>
                                    
                                    <textarea 
                                        readOnly 
                                        value={bookingSuccessData}
                                        className="bg-gray-50 p-4 rounded-xl text-left text-sm text-gray-700 border border-gray-200 h-48 overflow-y-auto resize-none outline-none focus:border-green-400"
                                    ></textarea>
                                    
                                    <button onClick={copyToClipboard} className="w-full py-3 bg-gray-200 text-gray-800 font-bold rounded-xl hover:bg-gray-300 transition-all flex items-center justify-center gap-2">
                                        📋 一鍵複製確認信文字
                                    </button>
                                    
                                    <button onClick={confirmAndSaveBooking} className="w-full mt-2 py-4 bg-ins-darkPurple text-white font-bold text-lg rounded-2xl shadow-lg hover:bg-purple-800 transition-all">
                                        我已成功送出，鎖定時段並返回 ✨
                                    </button>

                                    <button onClick={resetAllToHome} className="mt-2 text-sm text-gray-400 hover:text-gray-600 underline">
                                        我還沒匯款/決定好，放棄並返回修改
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-white p-8 rounded-3xl shadow-cute border-2 border-ins-pink flex flex-col gap-4 text-center justify-center relative">
                                    <h2 className="text-2xl font-bold text-ins-darkPurple mb-2">預約確認信💌已生成！</h2>
                                    <p className="text-red-500 font-bold mb-2">⚠️ 尚未完成預約與鎖定 ⚠️</p>
                                    <p className="text-gray-600 text-sm mb-2">請務必點擊下方按鈕，跳轉並將確認信傳送給官方帳號喔！</p>
                                    
                                    <div className="bg-ins-pink/30 p-4 rounded-xl text-left text-sm text-gray-700 whitespace-pre-wrap border border-pink-200 h-64 overflow-y-auto select-all">
                                        {bookingSuccessData}
                                    </div>
                                    
                                    <button onClick={goToLine} className="w-full mt-4 py-4 bg-[#00B900] text-white font-bold text-lg rounded-2xl shadow-lg hover:opacity-90 transition-all">
                                        前往 LINE 傳送確認信
                                    </button>
                                    
                                    <button onClick={resetAllToHome} className="mt-2 text-sm text-gray-400 hover:text-gray-600 underline">返回修改內容</button>
                                </div>
                            )
                        ) : (
                            <div className="flex flex-col gap-6">
                                <div className="bg-white p-5 rounded-3xl shadow-cute border-2 border-ins-pink text-sm text-ins-text">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold text-lg flex items-center gap-2"><span className="text-xl">💰</span> 價目表與須知</h3>
                                        <button onClick={() => setShowRulesModal(true)} className="text-xs bg-red-100 text-red-500 font-bold px-2 py-1 rounded-md hover:bg-red-200 transition shadow-sm">
                                            ⚠️ 約會規則請詳閱
                                        </button>
                                    </div>
                                    <ul className="space-y-1 list-disc list-inside opacity-90 pl-1">
                                        <li>基本鐘點費：<span className="font-bold text-ins-accent">$1000/hr</span> (2小時起，限公開場所)</li>
                                        <li>4 小時以上：<span className="font-bold">9 折</span></li>
                                        <li>半日 (6 小時)：<span className="font-bold">$5200</span></li>
                                        <li>一日 (12 小時)：<span className="font-bold">$8800</span></li>
                                        <li>🌙 夜間時段 (00:00~09:59)：每小時加計 <span className="text-red-500">20%</span></li>
                                        <li>🚗 外縣市車馬費：雙北以外酌收高鐵來回票價，<span className="font-bold text-red-500">併入定金收取</span></li>
                                    </ul>
                                    <div className="mt-3 pt-3 border-t border-ins-pink bg-ins-pink/30 p-3 rounded-lg">
                                        <div className="font-bold text-ins-darkPurple flex items-center gap-1 mb-1">👑 成為小屁孩的大乾爹 ✨</div>
                                        <p className="text-xs leading-relaxed mb-1">約會成功完成達 3 次以上自動升級！享有鐘點 <b>8折</b>、半日 <b>75折</b>、一日 <b>66折</b> 優惠。解鎖【過夜方案】與【抱抱睡方案】！</p>
                                        <p className="text-xs text-gray-500 italic">* VIP 若跨夜間時段，該時段無折扣，以原價計算。</p>
                                        
                                        {isVip && (

                                                    <li>全日/多日過夜：每 24 小時鐘點費原價打 75 折，加鐘以 8 折計。</li>

                                                </p>

                                        </div>
                                        <div className="w-1/2">
                                            <label className="block text-sm font-bold text-ins-darkPurple mb-1">預約時數</label>
                                            <div className="flex gap-2">
                                                {planType === 'overnight' && (
                                                    <select value={selectedDays} onChange={(e) => setSelectedDays(parseInt(e.target.value))} className="w-1/2 px-2 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-ins-accent outline-none text-sm">
                                                        {Array.from({ length: 7 }).map((_, i) => (<option key={i+1} value={i+1}>{i+1} 天</option>))}
                                                    </select>
                                                )}
                                                <select value={selectedDuration} onChange={(e) => setSelectedDuration(parseInt(e.target.value))} className={`${planType === 'overnight' ? 'w-1/2' : 'w-full'} px-2 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-ins-accent outline-none text-sm`}>
                                                    {planType === 'overnight' 
                                                        ? Array.from({ length: 24 }).map((_, i) => (<option key={i} value={i}>{i} 小時</option>))
                                                        : planType === 'normal'
                                                            ? Array.from({ length: 17 }).map((_, i) => (<option key={i+2} value={i+2}>{i+2} 小時</option>))
                                                            : Array.from({ length: 23 }).map((_, i) => (<option key={i+2} value={i+2}>{i+2} 小時</option>))
                                                    }
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-4 p-3 bg-pink-50 rounded-xl border border-pink-100">
                                        <div className="w-1/2">
                                            <label className="block text-xs font-bold text-ins-darkPurple mb-1">📍 約會縣市</label>
                                            <select value={location} onChange={(e) => setLocation(e.target.value)} className="w-full px-2 py-2 rounded-lg bg-white border border-pink-200 focus:border-ins-accent outline-none text-sm text-gray-700">
                                                {Object.keys(thsrFares).map(city => (
                                                    <option key={city} value={city}>{city}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="w-1/2">
                                            <label className="block text-xs font-bold text-ins-darkPurple mb-1">🚗 交通方式</label>
                                            <select value={transportation} onChange={(e) => setTransportation(e.target.value)} className="w-full px-2 py-2 rounded-lg bg-white border border-pink-200 focus:border-ins-accent outline-none text-sm text-gray-700">
                                                <option value="大眾交通">大眾交通</option>
                                                <option value="開車接送">開車接送</option>
                                                <option value="機車接送">機車接送</option>
                                                <option value="召喚小屁孩至外縣市約會（需收取車馬費）">召喚小屁孩 (收取車馬費)</option>
                                            </select>
                                        </div>
                                    </div>
                                    {transportation === '召喚小屁孩至外縣市約會（需收取車馬費）' && location !== '台北' && location !== '板橋' && location !== '南港' && (
                                        <div className="text-xs text-red-500 font-bold px-2 flex justify-between items-center">
                                            <span>※ 雙北以外酌收高鐵來回票作為車馬費 (併入定金)</span>
                                            <button onClick={() => setModalConfig({isOpen:true, title:'高鐵票價表', isImage: true, url:'fares.PNG'})} className="underline text-blue-500 hover:text-blue-700">查看票價表</button>
                                        </div>
                                    )}

                                    <div>
                                        <div className="flex justify-between items-end mb-1 mt-2">
                                            <label className="block text-sm font-bold text-ins-darkPurple">行程細節與備註</label>
                                            <button type="button" onClick={handleAIGenerateItinerary} disabled={isGeneratingItinerary} className="text-xs bg-gradient-to-r from-ins-accent to-ins-darkPurple text-white px-3 py-1 rounded-full shadow-md hover:-translate-y-0.5 disabled:opacity-50 flex items-center gap-1">{isGeneratingItinerary ? '✨ 思考中...' : '✨ AI 幫我排行程'}</button>
                                        </div>
                                        <textarea value={itinerary} onChange={(e) => setItinerary(e.target.value)} rows="3" className="w-full px-4 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-ins-accent focus:bg-white transition-all outline-none resize-none" placeholder="看電影、喝咖啡..."></textarea>
                                    </div>

                                    {priceInfo && (
                                        <div className="mt-auto bg-ins-pink/50 p-4 rounded-2xl">
                                            <div className="flex justify-between items-center mb-1 text-sm"><span className="text-gray-600">基本費用 ({totalHours}小時)</span><span>${priceInfo.basePrice}</span></div>
                                            {priceInfo.midnightCount > 0 && <div className="flex justify-between items-center mb-1 text-sm text-red-400"><span>夜間時段差額/加成 ({priceInfo.midnightCount}小時)</span><span>+${priceInfo.midnightSurcharge}</span></div>}
                                            {travelFee > 0 && <div className="flex justify-between items-center mb-1 text-sm text-ins-darkPurple font-bold"><span>車馬費 (高鐵來回)</span><span>+${travelFee}</span></div>}
                                            
                                            {priceInfo.isVip && <div className="text-xs text-ins-accent text-right font-bold mb-2">已套用 VIP 專屬折扣/方案 ✨</div>}
                                            <div className="flex justify-between items-end border-t border-pink-200 pt-2 mt-2">
                                                <span className="font-bold text-ins-darkPurple">總計金額</span>
                                                <span className="text-3xl font-black text-ins-accent">${priceInfo.total + travelFee}</span>
                                            </div>
                                            
                                            <div className="mt-3 pt-3 border-t border-pink-300">
                                                <div className="flex justify-between items-center text-sm font-bold text-ins-darkPurple mb-1">
                                                    <span>💳 應付定金 (含車馬費)</span>
                                                    <span className="text-lg">${depositAmount}</span>
                                                </div>
                                                <div className="text-xs text-gray-600 bg-white p-3 rounded-lg border border-pink-200 mt-2">
                                                    <p className="mb-1 font-bold text-ins-text">匯款資訊 (請於預約前完成匯款)：</p>
                                                    <p>台北富邦銀行 (012)</p>
                                                    <p className="font-mono font-bold text-sm text-ins-darkPurple tracking-widest mt-1 mb-3">81680004182967</p>
                                                    
                                                    <div className="border-t border-gray-100 pt-2">
                                                        <label className="block text-ins-darkPurple font-bold mb-1">請填寫匯款帳號後五碼 (必填) 👇</label>
                                                        <input 
                                                            type="text" 
                                                            maxLength="5" 
                                                            value={bankAccountLast5} 
                                                            onChange={(e) => setBankAccountLast5(e.target.value.replace(/\D/g, ''))} 
                                                            className="w-full p-2 rounded bg-gray-50 border border-pink-300 focus:border-ins-accent outline-none text-center font-mono font-bold text-ins-darkPurple tracking-widest" 
                                                            placeholder="例如：12345" 
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <button onClick={handleBookingSubmit} className="w-full mt-2 py-4 bg-gradient-to-r from-ins-accent to-ins-darkPurple text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95">確認送出並生成確認信💌</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 管理員控制區 */}
                    <div className="fixed bottom-4 left-4 flex gap-2 z-50">
                        <button onClick={() => { if (isAdmin) setIsAdmin(false); else setShowAdminLogin(true); }} className={`text-xs px-3 py-2 rounded-full shadow transition-all ${isAdmin ? 'bg-red-500 text-white font-bold' : 'bg-white text-gray-500 opacity-40 hover:opacity-100'}`}>
                            {isAdmin ? "🔒 關閉管理員" : "管理員登入"}
                        </button>
                        {isAdmin && <button onClick={() => setShowMembersModal(true)} className="text-xs px-3 py-2 rounded-full shadow transition-all bg-ins-darkPurple text-white font-bold hover:bg-purple-800">👥 會員管理</button>}
                    </div>

                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-cute text-center">
                                <h3 className="text-lg font-bold text-ins-darkPurple mb-4">輸入管理員密碼</h3>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} className="w-full p-3 mb-4 rounded-xl bg-gray-50 border-2 border-ins-pink outline-none text-center tracking-widest" placeholder="••••" autoFocus />
                                <div className="flex gap-2">
                                    <button onClick={() => { setShowAdminLogin(false); setAdminPwd(''); }} className="w-1/2 py-2 bg-gray-200 rounded-xl font-bold">取消</button>
                                    <button onClick={() => { if (adminPwd === '0624') { setIsAdmin(true); setShowAdminLogin(false); setAdminPwd(''); } else { showModal('錯誤', '密碼錯誤！'); setAdminPwd(''); } }} className="w-1/2 py-2 bg-ins-accent text-white rounded-xl font-bold">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <AdminBookingModal 
                        isOpen={!!selectedAdminBooking} 
                        booking={selectedAdminBooking}
                        onClose={() => setSelectedAdminBooking(null)}
                        onConfirmEnd={async (b) => {
                            try {
                                const handle = b.twitter;
                                const currentCount = members[handle]?.bookingCount || 0;
                                const updatedMembers = { ...members, [handle]: { twitter: handle, bookingCount: currentCount + 1 } };
                                setMembers(updatedMembers);
                                setLocalData('cute_calendar_members', updatedMembers);

                                const updatedBookings = bookings.map(bk => bk.id === b.id ? { ...bk, status: 'completed' } : bk);
                                setBookings(updatedBookings);
                                setLocalData('cute_calendar_bookings', updatedBookings);

                                if (db && window.FirebaseLib) {
                                    const { doc, setDoc, updateDoc } = window.FirebaseLib;
                                    await setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { twitter: handle, bookingCount: currentCount + 1 }, { merge: true });
                                    await updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'completed' });
                                }
                                setSelectedAdminBooking(null);
                                showModal('審核成功', `已將 @${handle} 的完成次數 +1，並將約會標記為已完成！`);
                            } catch(e) { showModal('審核成功', `已在本地端將約會標記為已完成！`); }
                        }}
                        onRevertComplete={async (b) => {
                            try {
                                const handle = b.twitter;
                                const currentCount = members[handle]?.bookingCount || 0;
                                const newCount = Math.max(0, currentCount - 1);
                                const updatedMembers = { ...members, [handle]: { twitter: handle, bookingCount: newCount } };
                                setMembers(updatedMembers);
                                setLocalData('cute_calendar_members', updatedMembers);

                                const updatedBookings = bookings.map(bk => bk.id === b.id ? { ...bk, status: 'pending' } : bk);
                                setBookings(updatedBookings);
                                setLocalData('cute_calendar_bookings', updatedBookings);

                                if (db && window.FirebaseLib) {
                                    const { doc, setDoc, updateDoc } = window.FirebaseLib;
                                    await setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { twitter: handle, bookingCount: newCount }, { merge: true });
                                    await updateDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'pending' });
                                }
                                setSelectedAdminBooking(null);
                                showModal('撤銷成功', `已取消標記，@${handle} 的完成次數已還原。`);
                            } catch(e) { showModal('撤銷成功', `已取消標記！`); }
                        }}
                        onCancelBooking={async (b) => {
                            try {
                                const updatedBookings = bookings.filter(bk => bk.id !== b.id);
                                setBookings(updatedBookings);
                                setLocalData('cute_calendar_bookings', updatedBookings);

                                if (db && window.FirebaseLib) {
                                    const { doc, deleteDoc } = window.FirebaseLib;
                                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/bookings`, b.id));
                                }
                                setSelectedAdminBooking(null);
                                showModal('已刪除', '已取消該預約並釋出時段！');
                            } catch(e) { showModal('已刪除', '已取消該預約並釋出時段！'); }
                        }}
                    />

                    <CustomerHistoryModal
                        isOpen={showHistoryModal}
                        history={customerHistory}
                        onClose={() => setShowHistoryModal(false)}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal}
                        members={members}
                        onClose={() => setShowMembersModal(false)}
                        onToggleBlacklist={async (handle, currentStatus) => {
                            try { 
                                const updatedMembers = { ...members, [handle]: { ...members[handle], isBlacklisted: !currentStatus } };
                                setMembers(updatedMembers);
                                setLocalData('cute_calendar_members', updatedMembers);

                                if (db && window.FirebaseLib) {
                                    const { doc, setDoc } = window.FirebaseLib;
                                    await setDoc(doc(db, `artifacts/${appId}/public/data/members`, handle), { isBlacklisted: !currentStatus }, { merge: true }); 
                                }
                            } catch(e) { console.error(e); }
                        }}
                    />

                    {modalConfig.isImage ? (
                        <ImageModal 
                            isOpen={modalConfig.isOpen} 
                            title={modalConfig.title} 
                            imageUrl={modalConfig.url} 
                            onClose={closeModal} 
                        />
                    ) : (
                        <Modal isOpen={modalConfig.isOpen} title={modalConfig.title} message={modalConfig.message} onClose={closeModal} />
                    )}

                    <ImageModal 
                        isOpen={showRulesModal}
                        title="📜 約會規則與注意事項"
                        imageUrl="rules.PNG"
                        onClose={() => setShowRulesModal(false)}
                    />
                </div>
            );
        };

        const RootComponent = () => {
            return <App />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootComponent />);
    </script>
</body>
</html>
