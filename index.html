<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小屁孩的純約會行事曆～</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'] },
                    colors: { cream: { bg: '#FAF5EF', text: '#382E2B', subtext: '#7A6E65' } }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; background-color: #FAF5EF;
            background-image: radial-gradient(#E2D6C8 1.2px, transparent 1.2px);
            background-size: 24px 24px; color: #382E2B;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden; position: relative;
        }
        .cloud-card { position: relative; z-index: 1; padding: 32px 24px; margin: 18px 12px; }
        .cloud-card::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FFFFFF; border: 12px solid #E3D1BF; border-radius: 40px;
            filter: url(#cloud-wave-filter); box-shadow: 0 12px 25px rgba(180, 150, 130, 0.15);
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); will-change: filter;
        }
        .cloud-vip-card { position: relative; z-index: 1; padding: 22px 18px; margin-top: 16px; }
        .cloud-vip-card::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FDF4E8; border: 6px solid #E3D1BF; border-radius: 28px;
            filter: url(#cloud-wave-filter); -webkit-backface-visibility: hidden; backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); will-change: filter;
        }
        .foam-shape { border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px !important; }
        .mild-wave-bg {
            position: absolute; inset: 0; z-index: -1; filter: url(#mild-wave-filter);
            border-radius: 28px 22px 26px 24px / 22px 28px 24px 26px; transition: all 0.2s ease;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
            pointer-events: none;
        }
        .safari-repaint-fix {
            position: relative;
            z-index: 20;
            isolation: isolate;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
        }
        .wavy-input-group { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; }
        .wavy-input-group::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-color: #FAF7F2; border: 2px solid #EAE1D7;
            border-radius: 26px 20px 24px 22px / 20px 26px 22px 24px;
            filter: url(#mild-wave-filter); transition: all 0.2s ease;
            -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0);
        }
        .wavy-input-group:focus-within::before {
            background-color: #FFFFFF; border-color: #C89B7B; box-shadow: 0 0 0 4px rgba(200, 155, 123, 0.12);
        }
        .wavy-input-group input, .wavy-input-group select, .wavy-input-group textarea {
            width: 100%; background: transparent; border: none; outline: none; color: #382E2B;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4B392; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #C89B7B; }
        .stripe-pattern { background: repeating-linear-gradient(45deg, #F5EFE8, #F5EFE8 10px, #EAE2D8 10px, #EAE2D8 20px); }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0.7); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(216, 136, 112, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(216, 136, 112, 0); }
        }
        .pulse-badge { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #8C5E3C; font-size: 16px;">載入中... ☕</div>
    </div>

    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; left: -9999px; top: -9999px; pointer-events: none;" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <defs>
            <filter id="cloud-wave-filter" x="-40%" y="-40%" width="180%" height="180%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="mild-wave-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <script type="module">
        try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            window.FirebaseLib = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc };
            window.dispatchEvent(new Event('firebaseready'));
        } catch(e) { console.warn("Firebase Async Load Skip"); }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const _h = (s) => { let h = 0; for(let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0; return h; };

        const memoryStorage = {};
        const getLocalData = (key, defaultVal) => {
            try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : defaultVal; }
            catch (e) { return memoryStorage[key] !== undefined ? memoryStorage[key] : defaultVal; }
        };
        const setLocalData = (key, val) => {
            try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) { memoryStorage[key] = val; }
        };

        const thsrFares = {
            "南港": 0, "台北": 0, "新北": 0, "桃園": 125, "新竹": 250, "苗栗": 385,
            "台中": 645, "彰化": 765, "雲林": 870, "嘉義": 1015, "台南": 1280, "高雄": 1415
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) slots.push(getSlotString(baseDate, i));
            return slots;
        };

        const isSystemUnavailable = (slotStr) => {
            const parts = slotStr.split('_');
            if (parts.length !== 2) return false;
            const slotDate = new Date(`${parts[0]}T00:00:00`);
            const hour = parseInt(parts[1], 10);
            if (slotDate >= new Date('2027-01-04T00:00:00')) return false;
            const day = slotDate.getDay();
            if ((day === 2 || day === 3) && (hour >= 8 && hour < 12)) return true;
            if ((day === 2 || day === 4) && (hour >= 15 && hour < 20)) return true;
            if (day === 5 && (hour >= 13 && hour < 20)) return true;
            return false;
        };

        const isSameBooking = (a, b) => {
            if (!a || !b) return false;
            if (a.id && b.id && a.id === b.id) return true;
            return (
                (a.twitter || '').toLowerCase() === (b.twitter || '').toLowerCase() &&
                a.date === b.date &&
                Number(a.startHour) === Number(b.startHour) &&
                Number(a.duration) === Number(b.duration)
            );
        };

        const deduplicateBookings = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();
            list.forEach(item => {
                if (!item) return;
                const key = item.id || `${item.twitter}_${item.date}_${item.startHour}_${item.duration}`;
                let dupKey = null;
                for (let [k, ex] of map.entries()) {
                    if (isSameBooking(ex, item)) {
                        dupKey = k; break;
                    }
                }
                if (dupKey) {
                    const ex = map.get(dupKey);
                    if (item.status === 'confirmed' || item.status === 'completed' || !ex.status) { map.delete(dupKey); map.set(key, item); }
                } else map.set(key, item);
            });
            return Array.from(map.values());
        };

        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0, extraHours = 0, midnightCount = 0, midnightSurcharge = 0;
            const BASE_HR = 1000;
            if (planType === 'overnight' && isVip) {
                basePrice = (Math.floor(duration / 24) * 18000) + ((duration % 24) * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2);
                if (duration >= 12) basePrice *= 0.8;
            } else {
                if (isVip) {
                    basePrice = duration >= 12 ? duration * 660 : duration >= 6 ? duration * 750 : duration * 800;
                } else {
                    if (duration >= 12) { basePrice = 8800; extraHours = duration - 12; }
                    else if (duration >= 6) { basePrice = 5200; extraHours = duration - 6; }
                    else if (duration >= 4) { basePrice = duration * BASE_HR * 0.9; }
                    else { basePrice = duration * BASE_HR; }
                    if (extraHours > 0) basePrice += extraHours * (BASE_HR * 0.9);
                }
                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) midnightCount++;
                }
                if (midnightCount > 0) {
                    midnightSurcharge = isVip ? midnightCount * (BASE_HR - (basePrice / duration)) : midnightCount * (BASE_HR * 0.2);
                }
            }
            return { total: Math.round(basePrice + midnightSurcharge), basePrice: Math.round(basePrice), midnightSurcharge: Math.round(midnightSurcharge), midnightCount, isVip };
        };

        // --- Modals ---
        const Modal = ({ isOpen, title, message, onClose, closeLabel, actionLabel, onAction }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center bg-[#382E2B]/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-extrabold text-[#382E2B] mb-2">{title}</h3>
                        <p className="text-[#7A6E65] mb-6 whitespace-pre-line text-sm leading-relaxed">{message}</p>
                        <div className="flex flex-col gap-2.5">
                            <button onClick={onClose} className="foam-shape w-full py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">
                                {closeLabel || '知道啦 ☕'}
                            </button>
                            {actionLabel && onAction && (
                                <button onClick={onAction} className="foam-shape w-full py-3 bg-[#FAF4EB] text-[#8C5E3C] border-2 border-[#E7D4BF] font-bold hover:bg-[#F3E7D7] transition-colors shadow-sm text-sm">
                                    {actionLabel}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);
            useEffect(() => { setCurrentUrl(encodeURI(imageUrl)); setHasError(false); }, [imageUrl]);
            const handleImgError = () => {
                if (currentUrl.endsWith('.PNG')) setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                else if (currentUrl.endsWith('.png')) setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                else setHasError(true);
            };
            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-md border border-[#EAE1D7] flex flex-col max-h-[90vh] shadow-2xl">
                        <h3 className="text-lg font-bold text-[#382E2B] mb-3 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-2xl border border-[#EAE1D7] flex items-center justify-center bg-[#FAF7F2] relative p-2">
                            {!hasError ? (<img src={currentUrl} alt={title} className="w-full h-auto object-contain rounded-xl" onError={handleImgError} />)
                            : (<div className="text-center p-6 bg-[#FAF4EB] rounded-2xl w-full"><p className="text-[#B8735C] font-bold mb-2">無法載入圖片 🥺</p></div>)}
                        </div>
                        <button onClick={onClose} className="foam-shape w-full mt-4 py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">我已詳閱並了解 ☕</button>
                    </div>
                </div>
            );
        };

        const ThsrFareModal = ({ isOpen, onClose, currentLocation }) => {
            if (!isOpen) return null;
            const candidateImages = ['thsr.PNG', 'thsr.png', '高鐵票價.PNG', '高鐵票價.png', '高鐵.PNG', '高鐵.png'];
            const [imgIndex, setImgIndex] = useState(0);
            const [showImg, setShowImg] = useState(true);

            useEffect(() => {
                setImgIndex(0);
                setShowImg(true);
            }, [isOpen]);

            const handleImgErr = () => {
                if (imgIndex + 1 < candidateImages.length) {
                    setImgIndex(imgIndex + 1);
                } else {
                    setShowImg(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-md border-2 border-[#EAE1D7] flex flex-col max-h-[88vh] shadow-2xl">
                        <h3 className="text-lg font-extrabold text-[#382E2B] mb-1 text-center flex items-center justify-center gap-1.5">
                            <span>🚄</span> 高鐵票價與來回車馬費一覽表
                        </h3>
                        <p className="text-[11px] text-[#7A6E65] text-center mb-3">
                            雙北以外地區若選擇「召喚小屁孩到高鐵站」，將依台北站出發之高鐵標準車廂<b>來回票價</b>併入定金收取唷！
                        </p>
                        <div className="overflow-y-auto flex-grow rounded-2xl border border-[#EAE1D7] bg-[#FAF7F2] p-3 space-y-3">
                            {showImg && (
                                <img
                                    src={encodeURI(candidateImages[imgIndex])}
                                    alt="高鐵票價表"
                                    className="w-full h-auto object-contain rounded-xl border border-[#EAE1D7]"
                                    onError={handleImgErr}
                                />
                            )}
                            <div className="grid grid-cols-3 text-xs font-extrabold text-[#8C5E3C] bg-[#FAF4EB] border border-[#E7D4BF] rounded-xl py-2 px-3 text-center">
                                <span className="text-left">約會縣市</span>
                                <span>高鐵單程</span>
                                <span className="text-right">來回車馬費</span>
                            </div>
                            <div className="divide-y divide-[#EAE1D7] bg-white rounded-xl border border-[#EAE1D7] px-3">
                                {Object.entries(thsrFares).map(([city, fare]) => {
                                    const isCurrent = currentLocation === city;
                                    return (
                                        <div key={city} className={`grid grid-cols-3 py-2 text-xs items-center text-center ${isCurrent ? 'font-extrabold text-[#C89B7B] bg-[#FDF4E8] -mx-3 px-3' : 'text-[#382E2B]'}`}>
                                            <span className="text-left flex items-center gap-1">
                                                {city} {isCurrent && <span className="text-[10px] bg-[#C89B7B] text-white px-1.5 py-0.2 rounded-full">目前選擇</span>}
                                            </span>
                                            <span className="text-[#7A6E65]">{fare === 0 ? '免車馬費' : `$${fare}`}</span>
                                            <span className="text-right font-bold text-[#8C5E3C]">{fare === 0 ? '$0' : `+$${fare * 2}`}</span>
                                        </div>
                                    );
                                })}
                                <div className="grid grid-cols-3 py-2.5 text-xs items-center text-center text-[#8C5E3C] font-bold">
                                    <span className="text-left">其他地區 / 海外</span>
                                    <span className="col-span-2 text-right text-[#B8735C]">依實際交通車馬費另計</span>
                                </div>
                            </div>
                        </div>
                        <button onClick={onClose} className="foam-shape w-full mt-4 py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">
                            我知道啦 ☕
                        </button>
                    </div>
                </div>
            );
        };

        const AdminPendingModal = ({ isOpen, pendingBookings, members, onClose, onApprove, onReject }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">待審核預約 ({pendingBookings.length})</h3>
                        {pendingBookings.length === 0 ? <p className="text-center text-[#7A6E65]">目前沒有新預約。</p> : pendingBookings.map((b, idx) => {
                            const displayNick = b.nickname || members?.[b.twitter]?.nickname;
                            return (
                                <div key={b.id || idx} className="border border-[#E7D4BF] p-3 mb-3 rounded-xl bg-[#FAF4EB]">
                                    <p className="font-bold text-[#382E2B]">
                                        @{b.twitter} {displayNick ? <span className="text-[#8C5E3C] text-xs font-bold ml-1">({displayNick})</span> : null}
                                    </p>
                                    <p className="text-sm text-[#7A6E65]">{b.date} {String(b.startHour).padStart(2, '0')}:00 ({b.duration}h) · {b.location || '新北'}</p>
                                    <div className="flex gap-2 mt-3">
                                        <button type="button" onClick={() => onApprove(b)} className="flex-1 bg-[#849B89] text-white py-1.5 rounded-lg font-bold shadow-sm active:scale-95 transition">核準</button>
                                        <button type="button" onClick={() => onReject(b)} className="flex-1 bg-[#D98880] text-white py-1.5 rounded-lg font-bold shadow-sm active:scale-95 transition">拒絕</button>
                                    </div>
                                </div>
                            );
                        })}
                        <button type="button" onClick={onClose} className="w-full mt-2 py-2 bg-[#EAE1D7] text-[#382E2B] font-bold rounded-xl shadow-sm">關閉</button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, members, onClose, onConfirmEnd, onRevertComplete, onCancelBooking }) => {
            if (!isOpen || !booking) return null;
            const displayNick = booking.nickname || members?.[booking.twitter]?.nickname;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-md border-2 border-[#EAE1D7]">
                        <h3 className="text-xl font-bold text-[#8C5E3C] mb-4">管理預約</h3>
                        <p className="font-bold text-[#382E2B]">
                            @{booking.twitter} {displayNick ? <span className="text-[#8C5E3C] text-sm font-bold ml-1">({displayNick})</span> : null}
                        </p>
                        <p className="text-sm text-[#7A6E65] mb-4">{booking.date} {String(booking.startHour).padStart(2, '0')}:00 ({booking.duration}h)</p>
                        <div className="flex flex-col gap-2">
                            {booking.status !== 'completed' && (
                                <button type="button" onClick={() => onConfirmEnd(booking)} className="bg-[#849B89] text-white py-2.5 rounded-xl font-bold shadow-sm active:scale-95 transition">
                                    標記為已完成 (累積 1 次)
                                </button>
                            )}
                            {booking.status === 'completed' && (
                                <button type="button" onClick={() => onRevertComplete(booking)} className="bg-[#C89B7B] text-white py-2.5 rounded-xl font-bold shadow-sm active:scale-95 transition">
                                    撤銷完成狀態
                                </button>
                            )}
                            <button type="button" onClick={() => onCancelBooking(booking)} className="bg-[#D98880] text-white py-2.5 rounded-xl font-bold shadow-sm active:scale-95 transition">
                                刪除此預約 (釋出時段)
                            </button>
                            <button type="button" onClick={onClose} className="bg-[#EAE1D7] text-[#382E2B] py-2.5 rounded-xl font-bold mt-2 shadow-sm">
                                關閉
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminMembersModal = ({ isOpen, members, bookings, unavailables, onClose, onToggleBlacklist, onImportData }) => {
            const [showPasteBox, setShowPasteBox] = useState(false);
            const [pasteCode, setPasteCode] = useState('');
            const [expandedMember, setExpandedMember] = useState(null);

            const consolidatedMembers = useMemo(() => {
                const map = {};
                Object.values(members || {}).forEach(m => {
                    if (!m || !m.twitter) return;
                    const key = m.twitter.toLowerCase();
                    map[key] = {
                        twitter: key,
                        nickname: m.nickname || '',
                        isBlacklisted: !!m.isBlacklisted,
                        records: []
                    };
                });
                (bookings || []).forEach(b => {
                    if (!b || !b.twitter) return;

                                                                <option value="大眾交通（限雙北地區）">大眾交通（限雙北地區）</option>
                                                                <option value="開車接送">開車接送</option>
                                                                <option value="機車接送">機車接送</option>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <option value="召喚小屁孩到高鐵站（再轉大眾or汽機車）">召喚小屁孩到高鐵站（再轉大眾or汽機車）</option>
                                                                <option value="開車接送">開車接送</option>
                                                                <option value="機車接送">機車接送</option>
                                                            </>
                                                        )}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        {showThsrFareButton && (
                                            <div className="relative z-10 mt-3 pt-2.5 border-t border-[#E7D4BF]/70 flex justify-end">
                                                <button
                                                    type="button"
                                                    onClick={() => setShowThsrModal(true)}
                                                    className="foam-shape text-xs bg-white text-[#8C5E3C] border border-[#E7D4BF] font-bold px-3.5 py-1.5 hover:bg-[#C89B7B] hover:text-white transition shadow-sm flex items-center gap-1"
                                                >
                                                    <span>🚄</span> 查看高鐵票價表
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-end mb-2 mt-1">
                                            <label className="block text-xs font-bold text-[#8C5E3C]">行程細節與備註</label>
                                            <button type="button" onClick={handleAIGenerateItinerary} disabled={isGeneratingItinerary || isOverseas} className="relative z-10 text-xs px-3 py-1.5 flex items-center gap-1 font-bold transition-all group disabled:opacity-60 disabled:cursor-not-allowed">
                                                <div className={`mild-wave-bg border shadow-sm ${isOverseas ? 'bg-[#B5A89D] border-[#B5A89D]' : 'bg-[#C89B7B] border-[#C89B7B] group-hover:bg-[#B58462]'}`}></div>
                                                <span className="text-white relative z-10">
                                                    {isOverseas ? '🔒 海外請自行填寫行程' : isGeneratingItinerary ? '✨ AI 搜尋規劃中...' : '✨ AI 幫我排行程'}
                                                </span>
                                            </button>
                                        </div>
                                        <div className="wavy-input-group p-3">
                                            <textarea
                                                value={itinerary}
                                                onChange={(e) => setItinerary(e.target.value)}
                                                rows="6"
                                                className="text-xs leading-relaxed resize-none h-full"
                                                placeholder={
                                                    isOverseas
                                                        ? "✈️ 請備註海外國家／城市，並自行填寫完整約會行程 📝"
                                                        : isOtherArea
                                                            ? "📍 請先註明約會縣市／地點，並填寫期望的約會行程（越具體越好唷 📝）"
                                                            : "請填寫期望的詳細約會行程（越具體越好唷 📝）"
                                                }
                                            ></textarea>
                                        </div>
                                    </div>

                                    {priceInfo && (
                                        <div className="mt-auto p-4 relative z-10 mt-2">
                                            <div className="mild-wave-bg bg-[#FAF4EB] border border-[#E7D4BF]/60"></div>
                                            <div key={priceRenderKey} className="safari-repaint-fix">
                                                <div className="flex justify-between items-center mb-1 text-xs">
                                                    <span className="text-[#7A6E65]">{`基本費用 (${totalHours}小時)`}</span>
                                                    <span>{`$${priceInfo.basePrice}`}</span>
                                                </div>
                                                {priceInfo.midnightCount > 0 && (
                                                    <div className="flex justify-between items-center mb-1 text-xs text-[#B8735C]">
                                                        <span>{`夜間時段差額/加成 (${priceInfo.midnightCount}小時)`}</span>
                                                        <span>{`+$${priceInfo.midnightSurcharge}`}</span>
                                                    </div>
                                                )}
                                                {travelFee > 0 && (
                                                    <div className="flex justify-between items-center mb-1 text-xs text-[#8C5E3C] font-bold">
                                                        <span>車馬費 (高鐵來回)</span>
                                                        <span>{`+$${travelFee}`}</span>
                                                    </div>
                                                )}
                                                {isExtraTravelFee && (
                                                    <div className="flex justify-between items-center mb-1 text-xs text-[#8C5E3C] font-bold">
                                                        <span>{`車馬費 (${location.replace('（請於行程欄位備註）', '')})`}</span>
                                                        <span>車馬費另計</span>
                                                    </div>
                                                )}
                                                {priceInfo.isVip && (
                                                    <div className="text-[11px] text-[#C89B7B] text-right font-bold mb-1.5">已套用 VIP 專屬折扣/方案 ✨</div>
                                                )}
                                                <div className="flex justify-between items-end border-t border-[#E7D4BF] pt-2 mt-2">
                                                    <span className="font-bold text-[#382E2B] text-xs">總計金額</span>
                                                    <span className="text-2xl font-extrabold text-[#C89B7B] leading-tight">
                                                        {`$${priceInfo.total + travelFee}`}
                                                    </span>
                                                </div>
                                                <div className="mt-3 pt-3 border-t border-[#E7D4BF]">
                                                    <div className="flex justify-between items-center text-xs font-bold text-[#382E2B] mb-1">
                                                        <span>💳 應付定金 (含車馬費)</span>
                                                        <span className="text-base text-[#8C5E3C]">
                                                            {`$${depositAmount}${isExtraTravelFee ? ' (車馬費另計)' : ''}`}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="relative z-20 text-xs text-[#7A6E65] p-4 mt-2 leading-relaxed">
                                                <div className="mild-wave-bg bg-white border border-[#EAE1D7]"></div>
                                                <p className="relative z-10 mb-0.5 font-bold text-[#382E2B]">匯款資訊 (請在預約審核完成後匯款)：</p>
                                                <p className="relative z-10">台北富邦銀行 (012)</p>
                                                <p className="relative z-10 font-mono font-bold text-sm text-[#8C5E3C] tracking-widest my-1">81680004182967</p>
                                                <div className="relative z-10 border-t border-[#EAE1D7] pt-2 mt-2">
                                                    <label className="block text-[#8C5E3C] font-bold mb-2">請填寫匯款帳號後五碼 (必填) 👇</label>
                                                    <div className="wavy-input-group px-3 py-1.5 h-11">
                                                        <input type="text" maxLength="5" value={bankAccountLast5} onChange={(e) => setBankAccountLast5(e.target.value.replace(/\D/g, ''))} className="text-center font-mono font-bold text-[#8C5E3C] tracking-widest text-base" placeholder="輸入帳號後 5 碼" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <button onClick={handleBookingSubmit} className="relative z-10 w-full mt-2 h-14 flex items-center justify-center font-bold text-base transition-all active:scale-95 group">
                                        <div className="mild-wave-bg bg-[#C89B7B] border-2 border-[#C89B7B] group-hover:bg-[#B58462] shadow-sm"></div>
                                        <span className="text-white relative z-10">確認送出並生成確認信 💌</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-4 left-4 right-4 flex flex-wrap items-center gap-2 z-50 pointer-events-none">
                        <button onClick={() => { if (isAdmin) setIsAdmin(false); else setShowAdminLogin(true); }} className={`pointer-events-auto text-xs px-3.5 py-2 shadow transition-all font-bold foam-shape ${isAdmin ? 'bg-[#B8735C] text-white' : 'bg-white text-[#7A6E65] border border-[#EAE1D7] opacity-60 hover:opacity-100'}`}>
                            {isAdmin ? "🔒 關閉管理員" : "管理員登入"}
                        </button>
                        {isAdmin && (
                            <>
                                <button onClick={() => setShowPendingModal(true)} className={`pointer-events-auto text-xs px-3.5 py-2 shadow transition-all font-bold flex items-center gap-1.5 foam-shape ${pendingBookings.length > 0 ? 'bg-[#B8735C] text-white pulse-badge' : 'bg-[#FAF4EB] text-[#8C5E3C] border border-[#E7D4BF]'}`}>
                                    <span>🔔</span> 新預約通知
                                    {pendingBookings.length > 0 && <span className="bg-white text-[#B8735C] text-[10px] px-1.5 py-0.2 rounded-full font-extrabold">{pendingBookings.length}</span>}
                                </button>
                                <button onClick={() => setShowMembersModal(true)} className="pointer-events-auto text-xs px-3.5 py-2 shadow transition-all bg-[#8C5E3C] text-white font-bold hover:bg-[#724B2E] foam-shape">
                                    👥 會員管理 / 匯出導入
                                </button>
                            </>
                        )}
                    </div>

                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-xs border-2 border-[#EAE1D7] text-center shadow-2xl">
                                <h3 className="text-lg font-bold text-[#382E2B] mb-4">輸入管理員密碼</h3>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} className="wavy-input-group w-full p-3 mb-4 text-center tracking-widest font-mono text-lg" placeholder="••••" autoFocus />
                                <div className="flex gap-2">
                                    <button onClick={() => { setShowAdminLogin(false); setAdminPwd(''); }} className="foam-shape w-1/2 py-2.5 bg-[#EAE1D7] text-[#382E2B] font-bold text-xs">取消</button>
                                    <button onClick={() => { if (_h(adminPwd) === 1538181) { setIsAdmin(true); setShowAdminLogin(false); setAdminPwd(''); } else { showModal('錯誤', '密碼錯誤！'); setAdminPwd(''); } }} className="foam-shape w-1/2 py-2.5 bg-[#C89B7B] text-white font-bold text-xs">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <AdminPendingModal
                        isOpen={showPendingModal} pendingBookings={pendingBookings} members={members} onRefresh={syncAllData} onClose={() => setShowPendingModal(false)}
                        onApprove={(b) => {
                            const baseList = deduplicateBookings([...bookings, ...getLocalData('cute_calendar_bookings', [])]);
                            const updated = baseList.map(item => isSameBooking(item, b) ? { ...item, status: 'confirmed' } : item);
                            setBookings(updated); setLocalData('cute_calendar_bookings', updated);
                            if (b.nickname) {
                                const hKey = (b.twitter || '').toLowerCase();
                                const updatedMembers = { ...members, [hKey]: { ...members[hKey], twitter: hKey, nickname: b.nickname } };
                                setMembers(updatedMembers); setLocalData('cute_calendar_members', updatedMembers);
                                try {
                                    if (db && window.FirebaseLib && hKey) {
                                        window.FirebaseLib.setDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/members`, hKey), { twitter: hKey, nickname: b.nickname }, { merge: true }).catch(e => console.warn(e));
                                    }
                                } catch (err) { console.warn(err); }
                            }
                            try {
                                if (db && window.FirebaseLib && b.id) {
                                    window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                            showModal('審核通過 ✨', `已同意 @${b.twitter}${b.nickname ? ` (${b.nickname})` : ''} 的約會！該時段已在行事曆鎖定為灰底。`);
                        }}
                        onReject={(b) => {
                            const baseList = deduplicateBookings([...bookings, ...getLocalData('cute_calendar_bookings', [])]);
                            const updated = baseList.filter(item => !isSameBooking(item, b));
                            setBookings(updated); setLocalData('cute_calendar_bookings', updated);
                            try {
                                if (db && window.FirebaseLib && b.id) {
                                    window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                            showModal('已拒絕', `已退回 @${b.twitter} 的預約申請。`);
                        }}
                    />

                    <AdminBookingModal
                        isOpen={!!selectedAdminBooking} booking={selectedAdminBooking} members={members} onClose={() => setSelectedAdminBooking(null)}
                        onConfirmEnd={(b) => {
                            setSelectedAdminBooking(null);
                            const baseList = deduplicateBookings([...bookings, ...getLocalData('cute_calendar_bookings', [])]);
                            const updated = baseList.map(item => isSameBooking(item, b) ? { ...item, status: 'completed' } : item);
                            setBookings(updated); setLocalData('cute_calendar_bookings', updated);
                            showModal('標記成功 🎉', `已將 @${b.twitter}${b.nickname ? ` (${b.nickname})` : ''} 的此筆約會標記為「已完成」！(次數計入 1 次)`);
                            try {
                                if (db && window.FirebaseLib && b.id) {
                                    window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'completed' }).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                        }}
                        onRevertComplete={(b) => {
                            setSelectedAdminBooking(null);
                            const baseList = deduplicateBookings([...bookings, ...getLocalData('cute_calendar_bookings', [])]);
                            const updated = baseList.map(item => isSameBooking(item, b) ? { ...item, status: 'confirmed' } : item);
                            setBookings(updated); setLocalData('cute_calendar_bookings', updated);
                            showModal('已撤銷', `已將約會狀態恢復為「已核準」。`);
                            try {
                                if (db && window.FirebaseLib && b.id) {
                                    window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                        }}
                        onCancelBooking={(b) => {
                            setSelectedAdminBooking(null);
                            const baseList = deduplicateBookings([...bookings, ...getLocalData('cute_calendar_bookings', [])]);
                            const updated = baseList.filter(item => !isSameBooking(item, b));
                            setBookings(updated); setLocalData('cute_calendar_bookings', updated);
                            showModal('已刪除', '已取消該預約並釋出時段！');
                            try {
                                if (db && window.FirebaseLib && b.id) {
                                    window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                        }}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal}
                        members={members}
                        bookings={bookings}
                        unavailables={unavailables}
                        onClose={() => setShowMembersModal(false)}
                        onImportData={handleImportBackupData}
                        onToggleBlacklist={(handle, currentStatus) => {
                            const updatedMembers = { ...members, [handle]: { ...members[handle], twitter: handle, isBlacklisted: !currentStatus } };
                            setMembers(updatedMembers); setLocalData('cute_calendar_members', updatedMembers);
                            try {
                                if (db && window.FirebaseLib && handle) {
                                    window.FirebaseLib.setDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/members`, handle), { twitter: handle, isBlacklisted: !currentStatus }, { merge: true }).catch(e => console.warn(e));
                                }
                            } catch (err) { console.warn(err); }
                        }}
                    />

                    <CustomerHistoryModal isOpen={showHistoryModal} history={customerHistory} onClose={() => setShowHistoryModal(false)} />
                    <ImageModal isOpen={showRulesModal} title="約會規則與細則詳閱" imageUrl="rules.PNG" onClose={() => setShowRulesModal(false)} />
                    <ThsrFareModal isOpen={showThsrModal} currentLocation={location} onClose={() => setShowThsrModal(false)} />
                    <Modal
                        isOpen={modalConfig.isOpen}
                        title={modalConfig.title}
                        message={modalConfig.message}
                        closeLabel={modalConfig.closeLabel}
                        actionLabel={modalConfig.actionLabel}
                        onAction={modalConfig.onAction}
                        onClose={closeModal}
                    />
                </div>
            );
        };

        try { ReactDOM.createRoot(document.getElementById('root')).render(<App />); }
        catch(e) { console.error("React Render Error:", e); }
    </script>
</body>
</html>
