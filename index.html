                food: ["碳佐麻里精品燒肉 高雄時代園區 (亞洲最美水上燒肉餐廳)", "茶六燒肉堂 高雄博愛店 (超人氣日式和牛燒肉盛宴)", "瑞豐夜市 / 六合夜市 (必吃天使雞排、萬國牛排、木瓜牛奶)"],
                walk: ["駁二藝術特區 & 大港橋 (搭乘輕軌看白色旋轉大橋與海港倉庫展覽)", "西子灣夕陽 & 打狗英國領事館 (紅磚古蹟眺望台灣海峽絕美落日)", "愛河灣 流行音樂中心 & 壽山忠烈祠 LOVE觀景台 (浪漫遊船與百萬港都夜景)"]
            }
        };

        // 智慧語意分類解析器：將客人的句子拆解並精準對應到真實名店類別
        const resolveCategoryFromText = (text) => {
            if (/海景|看海|海邊|海岸|淺水灣|沙灘/.test(text)) return { key: 'seacafe', title: '海景咖啡廳浪漫午茶' };
            if (/貓|擼貓|貓咪|寵物|狗|毛孩/.test(text)) return { key: 'cat', title: '療癒貓咪寵物互動午茶' };
            if (/夜市|小吃|逛夜市|街頭美食/.test(text)) return { key: 'nightmarket', title: '人氣觀光夜市美食探索' };
            if (/燒肉|烤肉|和牛|乾杯|屋馬|茶六/.test(text)) return { key: 'yakiniku', title: '頂級人氣燒肉饗宴' };
            if (/火鍋|麻辣鍋|涮涮鍋|海底撈|吃鍋|沙鍋/.test(text)) return { key: 'hotpot', title: '暖心人氣鍋物料理' };
            if (/拉麵|日料|日本料理|壽司|生魚片|丼飯/.test(text)) return { key: 'ramen', title: '職人濃厚系拉麵與日料' };
            if (/酒|微醺|餐酒館|酒吧|調酒|小酌|居酒屋/.test(text)) return { key: 'bistro', title: '浪漫微醺餐酒館時光' };
            if (/電影|看片|影城|威秀|秀泰/.test(text)) return { key: 'movie', title: '雙人舒適影城看電影' };
            if (/逛街|百貨|購物|買衣服|商圈|信義區|中山站|outlet/i.test(text)) return { key: 'mall', title: '人氣百貨商圈逛街約會' };
            if (/夜景|看夜景|夕陽|落日|摩天輪|高空/.test(text)) return { key: 'nightview', title: '絕美浪漫百萬夜景漫步' };
            if (/散步|老街|看展|美術館|博物館|文創|水族館|動物園|公園|踏青|悠閒|放鬆/.test(text)) return { key: 'walk', title: '浪漫景點與文青漫步' };
            if (/下午茶|咖啡|甜點|蛋糕|早午餐|喝茶|聊天/.test(text)) return { key: 'cafe', title: '人氣質感咖啡廳下午茶' };
            return null;
        };

        // 從指定縣市與分類中抽出 3 間不重複的真實名店
        const pick3RealStores = (city, catKey, usedSet) => {
            const cityData = CITY_REAL_DB[city];
            let pool = [];
            if (cityData && cityData[catKey]) {
                pool = [...cityData[catKey]];
            } else {
                const otherData = OTHER_CITIES_DB[city] || OTHER_CITIES_DB["桃園"];
                if (catKey === 'seacafe' || catKey === 'cafe' || catKey === 'cat') pool = [...otherData.cafe, ...otherData.walk];
                else if (catKey === 'nightmarket' || catKey === 'yakiniku' || catKey === 'hotpot' || catKey === 'ramen' || catKey === 'bistro') pool = [...otherData.food];
                else if (catKey === 'movie') pool = [...otherData.movie];
                else if (catKey === 'mall') pool = [...otherData.mall];
                else pool = [...otherData.walk, ...otherData.cafe];
            }
            let available = pool.filter(item => !usedSet.has(item.split(' ')[0]));
            if (available.length < 3) available = [...pool];
            // 隨機洗牌抽出 3 間
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            const picked = available.slice(0, 3);
            picked.forEach(p => usedSet.add(p.split(' ')[0]));
            return picked;
        };

        // 產生精準符合客人需求的真實店家行程
        const buildSmartRealItinerary = (city, startHour, totalHours, rawDemand, excludedList) => {
            const usedSet = new Set(excludedList || []);
            const timeBlocks = [];
            const step = totalHours <= 4 ? 2 : totalHours <= 8 ? 2 : 3;
            for (let h = 0; h < totalHours; h += step) {
                const bStart = (startHour + h) % 24;
                const bEnd = (startHour + Math.min(h + step, totalHours)) % 24;
                timeBlocks.push({
                    label: `${String(bStart).padStart(2, '0')}:00 - ${String(bEnd).padStart(2, '0')}:00`,
                    hour: bStart
                });
            }

            const hasSpecificDemand = rawDemand.length > 0 && !/^(沒想法|都可以|隨便|無|不知道)$/.test(rawDemand);

            if (hasSpecificDemand) {
                // 將客人的需求依標點符號與連接詞拆分成子需求（例如：「去海景咖啡廳吃下午茶，晚上再去逛夜市」）
                const clauses = rawDemand.split(/[，,、。；;！!\n]+|(?:然後|接著|再去|之後|晚上再去|下午再去)/).map(s => s.trim()).filter(Boolean);
                const matchedCategories = [];
                clauses.forEach(c => {
                    const resolved = resolveCategoryFromText(c);
                    if (resolved) matchedCategories.push(resolved);
                });
                if (matchedCategories.length === 0) {
                    const fallbackResolved = resolveCategoryFromText(rawDemand) || { key: 'cafe', title: `${city}質感約會探索` };
                    matchedCategories.push(fallbackResolved);
                }

                let lines = [`【專屬客製方案：為您量身規劃的${city}約會】`];
                timeBlocks.forEach((block, idx) => {
                    const catObj = matchedCategories[idx % matchedCategories.length];
                    const stores = pick3RealStores(city, catObj.key, usedSet);
                    lines.push(`\n• ${block.label}｜${catObj.title}`);
                    stores.forEach((st, sIdx) => {
                        lines.push(`👉 選項${sIdx + 1}：${st}`);
                    });
                });
                return lines.join('\n');
            } else {
                // 客人沒填寫想法時，自動規劃 2 套主題截然不同且店家完全不重複的精選方案
                const plan1Themes = [
                    { key: 'cafe', title: '質感午茶與甜點時光' },
                    { key: 'mall', title: '人氣商圈漫步與逛街' },
                    { key: 'yakiniku', title: '人氣燒肉美食饗宴' },
                    { key: 'nightview', title: '浪漫微風夜景散步' }
                ];
                const plan2Themes = [
                    { key: 'walk', title: '浪漫文青景點漫遊' },
                    { key: 'movie', title: '雙人影城觀影體驗' },
                    { key: 'hotpot', title: '暖心人氣鍋物與夜市美食' },
                    { key: 'bistro', title: '微醺星空餐酒館小酌' }
                ];

                let lines = [`【方案一：${city}甜美午茶×質感美食約會】`];
                timeBlocks.forEach((block, idx) => {
                    const t = plan1Themes[idx % plan1Themes.length];
                    const stores = pick3RealStores(city, t.key, usedSet);
                    lines.push(`• ${block.label}｜${t.title}`);
                    stores.forEach((st, sIdx) => lines.push(`👉 選項${sIdx + 1}：${st}`));
                });

                lines.push(`\n【方案二：${city}浪漫漫步×微醺探索約會】`);
                timeBlocks.forEach((block, idx) => {
                    const t = plan2Themes[idx % plan2Themes.length];
                    const stores = pick3RealStores(city, t.key, usedSet);
                    lines.push(`• ${block.label}｜${t.title}`);
                    stores.forEach((st, sIdx) => lines.push(`👉 選項${sIdx + 1}：${st}`));
                });
                return lines.join('\n');
            }
        };

        const getSlotString = (dateObj, hourOffset = 0) => {
            const d = new Date(dateObj);
            d.setHours(d.getHours() + hourOffset, 0, 0, 0);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}`;
        };

        const generateSlotsForBooking = (dateStr, startHour, duration) => {
            const slots = [];
            const baseDate = new Date(`${dateStr}T00:00:00`);
            baseDate.setHours(startHour);
            for(let i = 0; i < duration; i++) slots.push(getSlotString(baseDate, i));
            return slots;
        };

        const isSystemUnavailable = (slotStr) => {
            const parts = slotStr.split('_');
            if (parts.length !== 2) return false;
            const slotDate = new Date(`${parts[0]}T00:00:00`);
            const hour = parseInt(parts[1], 10);
            if (slotDate >= new Date('2027-01-04T00:00:00')) return false;
            const day = slotDate.getDay();
            if ((day === 2 || day === 3) && (hour >= 8 && hour < 12)) return true;
            if ((day === 2 || day === 4) && (hour >= 15 && hour < 20)) return true;
            if (day === 5 && (hour >= 13 && hour < 20)) return true;
            return false;
        };

        const deduplicateBookings = (list) => {
            if (!Array.isArray(list)) return [];
            const map = new Map();
            list.forEach(item => {
                if (!item) return;
                const key = item.id || `${item.twitter}_${item.date}_${item.startHour}_${item.duration}`;
                let dupKey = null;
                for (let [k, ex] of map.entries()) {
                    if (ex.id === item.id || (ex.twitter === item.twitter && ex.date === item.date && ex.startHour === item.startHour && ex.duration === item.duration)) {
                        dupKey = k; break;
                    }
                }
                if (dupKey) {
                    const ex = map.get(dupKey);
                    if (item.status === 'confirmed' || item.status === 'completed' || !ex.status) { map.delete(dupKey); map.set(key, item); }
                } else map.set(key, item);
            });
            return Array.from(map.values());
        };

        const calculatePrice = (startHour, duration, isVip, planType) => {
            let basePrice = 0, extraHours = 0, midnightCount = 0, midnightSurcharge = 0;
            const BASE_HR = 1000;
            if (planType === 'overnight' && isVip) {
                basePrice = (Math.floor(duration / 24) * 18000) + ((duration % 24) * BASE_HR * 0.8);
            } else if (planType === 'cuddle' && isVip) {
                basePrice = duration * (BASE_HR * 1.2);
                if (duration >= 12) basePrice *= 0.8;
            } else {
                if (isVip) {
                    basePrice = duration >= 12 ? duration * 660 : duration >= 6 ? duration * 750 : duration * 800;
                } else {
                    if (duration >= 12) { basePrice = 8800; extraHours = duration - 12; }
                    else if (duration >= 6) { basePrice = 5200; extraHours = duration - 6; }
                    else if (duration >= 4) { basePrice = duration * BASE_HR * 0.9; }
                    else { basePrice = duration * BASE_HR; }
                    if (extraHours > 0) basePrice += extraHours * (BASE_HR * 0.9);
                }
                for (let i = 0; i < duration; i++) {
                    let h = (startHour + i) % 24;
                    if (h >= 0 && h < 10) midnightCount++;
                }
                if (midnightCount > 0) {
                    midnightSurcharge = isVip ? midnightCount * (BASE_HR - (basePrice / duration)) : midnightCount * (BASE_HR * 0.2);
                }
            }
            return { total: Math.round(basePrice + midnightSurcharge), basePrice: Math.round(basePrice), midnightSurcharge: Math.round(midnightSurcharge), midnightCount, isVip };
        };

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/30 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-extrabold text-[#382E2B] mb-2">{title}</h3>
                        <p className="text-[#7A6E65] mb-6 whitespace-pre-line text-sm leading-relaxed">{message}</p>
                        <button onClick={onClose} className="foam-shape w-full py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">知道啦 ☕</button>
                    </div>
                </div>
            );
        };

        const ImageModal = ({ isOpen, title, imageUrl, onClose }) => {
            if (!isOpen) return null;
            const [currentUrl, setCurrentUrl] = useState(encodeURI(imageUrl));
            const [hasError, setHasError] = useState(false);
            useEffect(() => { setCurrentUrl(encodeURI(imageUrl)); setHasError(false); }, [imageUrl]);
            const handleImgError = () => {
                if (currentUrl.endsWith('.PNG')) setCurrentUrl(encodeURI(imageUrl.replace('.PNG', '.png')));
                else if (currentUrl.endsWith('.png')) setCurrentUrl(encodeURI(imageUrl.replace('.png', '.PNG')));
                else setHasError(true);
            };
            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-[#382E2B]/50 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-md border border-[#EAE1D7] flex flex-col max-h-[90vh] shadow-2xl">
                        <h3 className="text-lg font-bold text-[#382E2B] mb-3 text-center">{title}</h3>
                        <div className="overflow-y-auto flex-grow rounded-2xl border border-[#EAE1D7] flex items-center justify-center bg-[#FAF7F2] relative p-2">
                            {!hasError ? (<img src={currentUrl} alt={title} className="w-full h-auto object-contain rounded-xl" onError={handleImgError} />)
                            : (<div className="text-center p-6 bg-[#FAF4EB] rounded-2xl w-full"><p className="text-[#B8735C] font-bold mb-2">無法載入圖片 🥺</p></div>)}
                        </div>
                        <button onClick={onClose} className="foam-shape w-full mt-4 py-3.5 bg-[#C89B7B] text-white font-bold hover:bg-[#B58462] transition-colors shadow-sm">我已詳閱並了解 ☕</button>
                    </div>
                </div>
            );
        };

        const AdminPendingModal = ({ isOpen, pendingBookings, onApprove, onReject, onClose, onRefresh }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-lg border-2 border-[#EAE1D7] flex flex-col max-h-[85vh] shadow-2xl">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-xl font-bold text-[#382E2B] flex items-center gap-2"><span>🔔</span> 待審核新預約 ({pendingBookings.length})</h3>
                            <button onClick={onRefresh} className="foam-shape text-xs bg-[#FAF4EB] text-[#8C5E3C] border border-[#E7D4BF] px-3 py-1.5 font-bold hover:bg-[#F3E7D7]">🔄 重新整理</button>
                        </div>
                        <div className="overflow-y-auto flex-grow mb-4 space-y-3.5 pr-1">
                            {pendingBookings.length === 0 ? (<div className="text-center py-10 text-[#A3968C] font-bold text-sm">目前沒有新的待審核預約唷 ☕</div>) : (
                                pendingBookings.map(b => (
                                    <div key={b.id} className="bg-[#FAF7F2] p-4 rounded-2xl border border-[#EAE1D7] shadow-sm text-xs text-[#382E2B]">
                                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-[#EAE1D7]">
                                            <span className="font-extrabold text-[#8C5E3C] text-sm">@{b.twitter}</span>
                                            <span className="text-[11px] text-[#A3968C]">{new Date(b.createdAt || Date.now()).toLocaleString('zh-TW')}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1.5 mb-2.5">
                                            <p><strong>📅 約會日期：</strong>{b.date}</p><p><strong>⏰ 開始時間：</strong>{String(b.startHour).padStart(2, '0')}:00</p>
                                            <p><strong>⏱️ 預約時數：</strong>{b.duration} 小時</p><p><strong>🎀 方案類型：</strong>{b.planType === 'overnight' ? '過夜之旅' : b.planType === 'cuddle' ? '抱抱睡' : '一般約會'}</p>
                                            <p><strong>📍 約會地點：</strong>{b.location}</p><p><strong>🚗 交通方式：</strong>{b.transportation}</p>
                                            <p className="text-[#C89B7B] font-bold"><strong>💰 總金額：</strong>${(b.priceInfo?.total || 0) + (b.travelFee || 0)}</p>
                                            <p className="text-[#8C5E3C] font-bold"><strong>🏦 匯款後五碼：</strong>{b.bankAccountLast5 || '未填寫'}</p>
                                        </div>
                                        <div className="bg-white p-2.5 rounded-xl border border-[#EAE1D7] text-xs mb-3">
                                            <p className="text-[#8C5E3C] font-bold mb-0.5">📝 行程細節：</p>
                                            <p className="text-[#7A6E65] whitespace-pre-line leading-relaxed">{b.itinerary}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => onApprove(b)} className="foam-shape flex-1 py-2.5 bg-[#849B89] text-white font-bold shadow hover:bg-[#6D8372] text-xs">✅ 同意預約</button>
                                            <button onClick={() => onReject(b)} className="foam-shape py-2.5 px-3 bg-[#FBF0EF] text-[#D98880] font-bold border border-[#F3D7D5] hover:bg-[#D98880] hover:text-white text-xs">❌ 拒絕/退回</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                        <button onClick={onClose} className="foam-shape w-full py-3 bg-[#EAE1D7] text-[#382E2B] font-bold hover:bg-[#DED2C6]">關閉</button>
                    </div>
                </div>
            );
        };

        const AdminBookingModal = ({ isOpen, booking, onConfirmEnd, onRevertComplete, onCancelBooking, onClose }) => {
            if (!isOpen || !booking) return null;
            const isCompleted = booking.status === 'completed';
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] text-center shadow-2xl">
                        <h3 className="text-xl font-bold text-[#382E2B] mb-3">已審核約會管理</h3>
                        {isCompleted && <div className="text-[#6D8372] font-bold mb-3 border border-[#C5D6C9] bg-[#E8EFE9] rounded-xl p-2 text-xs">✅ 此約會已標記為完成</div>}
                        <div className="flex flex-col gap-2.5 mt-4">
                            {!isCompleted ? (
                                <button onClick={() => onConfirmEnd(booking)} className="foam-shape w-full py-3 bg-[#849B89] text-white font-bold shadow-sm hover:bg-[#6D8372] text-xs">✅ 標記約會成功完成 (次數+1)</button>
                            ) : (
                                <button onClick={() => onRevertComplete(booking)} className="foam-shape w-full py-3 bg-[#D49B51] text-white font-bold shadow-sm hover:bg-[#B8813C] text-xs">↩️ 撤銷完成標記</button>
                            )}
                            <button onClick={() => onCancelBooking(booking)} className="foam-shape w-full py-3 bg-[#D98880] text-white font-bold shadow-sm hover:bg-[#C26F67] text-xs">🗑️ 取消並刪除此預約</button>
                            <button onClick={onClose} className="foam-shape w-full py-2.5 bg-[#EAE1D7] text-[#382E2B] font-bold hover:bg-[#DED2C6] text-xs">返回</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CustomerHistoryModal = ({ isOpen, history, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm border-2 border-[#EAE1D7] flex flex-col max-h-[80vh] shadow-2xl">
                        <h3 className="text-xl font-extrabold text-[#382E2B] mb-2 text-center">📜 過往約會紀錄</h3>
                        <p className="text-xs text-[#7A6E65] mb-4 text-center">以下是您已經成功完成的約會 ☕</p>
                        <div className="overflow-y-auto flex-grow mb-4 space-y-2.5 pr-1">
                            {history.length === 0 ? (<p className="text-center text-[#A3968C] text-sm py-6 font-medium">目前還沒有已完成的紀錄唷！</p>) : (
                                history.map(b => (
                                    <div key={b.id} className="bg-[#FAF7F2] p-3.5 rounded-2xl border border-[#EAE1D7] text-xs shadow-sm relative">

                    <div className="fixed bottom-4 left-4 flex items-center gap-2 z-50">
                        <button onClick={() => { if (isAdmin) setIsAdmin(false); else setShowAdminLogin(true); }} className={`text-xs px-3.5 py-2 shadow transition-all font-bold foam-shape ${isAdmin ? 'bg-[#B8735C] text-white' : 'bg-white text-[#7A6E65] border border-[#EAE1D7] opacity-60 hover:opacity-100'}`}>
                            {isAdmin ? "🔒 關閉管理員" : "管理員登入"}
                        </button>
                        {isAdmin && (
                            <>
                                <button onClick={() => setShowPendingModal(true)} className={`text-xs px-3.5 py-2 shadow transition-all font-bold flex items-center gap-1.5 foam-shape ${pendingBookings.length > 0 ? 'bg-[#B8735C] text-white pulse-badge' : 'bg-[#FAF4EB] text-[#8C5E3C] border border-[#E7D4BF]'}`}>
                                    <span>🔔</span> 新預約通知
                                    {pendingBookings.length > 0 && <span className="bg-white text-[#B8735C] text-[10px] px-1.5 py-0.2 rounded-full font-extrabold">{pendingBookings.length}</span>}
                                </button>
                                <button onClick={() => setShowMembersModal(true)} className="text-xs px-3.5 py-2 shadow transition-all bg-[#8C5E3C] text-white font-bold hover:bg-[#724B2E] foam-shape">👥 會員管理</button>
                            </>
                        )}
                    </div>

                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-[#382E2B]/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-xs border-2 border-[#EAE1D7] text-center shadow-2xl">
                                <h3 className="text-lg font-bold text-[#382E2B] mb-4">輸入管理員密碼</h3>
                                <input type="password" value={adminPwd} onChange={(e) => setAdminPwd(e.target.value)} className="wavy-input-group w-full p-3 mb-4 text-center tracking-widest font-mono text-lg" placeholder="••••" autoFocus />
                                <div className="flex gap-2">
                                    <button onClick={() => { setShowAdminLogin(false); setAdminPwd(''); }} className="foam-shape w-1/2 py-2.5 bg-[#EAE1D7] text-[#382E2B] font-bold text-xs">取消</button>
                                    <button onClick={() => { if (_h(adminPwd) === 1538181) { setIsAdmin(true); setShowAdminLogin(false); setAdminPwd(''); } else { showModal('錯誤', '密碼錯誤！'); setAdminPwd(''); } }} className="foam-shape w-1/2 py-2.5 bg-[#C89B7B] text-white font-bold text-xs">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <AdminPendingModal
                        isOpen={showPendingModal} pendingBookings={pendingBookings} onRefresh={syncAllData} onClose={() => setShowPendingModal(false)}
                        onApprove={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                            showModal('審核通過 ✨', `已同意 @${b.twitter} 的約會！該時段已在行事曆鎖定為灰底。`);
                        }}
                        onReject={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                            showModal('已拒絕', `已退回 @${b.twitter} 的預約申請。`);
                        }}
                    />

                    <AdminBookingModal
                        isOpen={!!selectedAdminBooking} booking={selectedAdminBooking} onClose={() => setSelectedAdminBooking(null)}
                        onConfirmEnd={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'completed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'completed' }).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('標記成功 🎉', `已將 @${b.twitter} 的此筆約會標記為「已完成」！(次數計入 1 次)`);
                        }}
                        onRevertComplete={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).map(item => item.id === b.id ? { ...item, status: 'confirmed' } : item);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.updateDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id), { status: 'confirmed' }).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('已撤銷', `已將約會狀態恢復為「已核準」。`);
                        }}
                        onCancelBooking={(b) => {
                            const updated = getLocalData('cute_calendar_bookings', []).filter(item => item.id !== b.id);
                            setBookings(deduplicateBookings(updated)); setLocalData('cute_calendar_bookings', updated);
                            if (db && window.FirebaseLib) window.FirebaseLib.deleteDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/bookings`, b.id)).catch(e => console.warn(e));
                            setSelectedAdminBooking(null); showModal('已刪除', '已取消該預約並釋出時段！');
                        }}
                    />

                    <AdminMembersModal
                        isOpen={showMembersModal} members={members} bookings={bookings} onClose={() => setShowMembersModal(false)}
                        onToggleBlacklist={(handle, currentStatus) => {
                            const updatedMembers = { ...members, [handle]: { ...members[handle], isBlacklisted: !currentStatus } };
                            setMembers(updatedMembers); setLocalData('cute_calendar_members', updatedMembers);
                            if (db && window.FirebaseLib) window.FirebaseLib.setDoc(window.FirebaseLib.doc(db, `artifacts/${appId}/public/data/members`, handle), { isBlacklisted: !currentStatus }, { merge: true }).catch(e => console.warn(e));
                        }}
                    />

                    <CustomerHistoryModal isOpen={showHistoryModal} history={customerHistory} onClose={() => setShowHistoryModal(false)} />
                    <ImageModal isOpen={showRulesModal} title="約會規則與細則詳閱" imageUrl="rules.PNG" onClose={() => setShowRulesModal(false)} />
                    <Modal isOpen={modalConfig.isOpen} title={modalConfig.title} message={modalConfig.message} onClose={closeModal} />
                </div>
            );
        };

        try { ReactDOM.createRoot(document.getElementById('root')).render(<App />); }
        catch(e) { console.error("React Render Error:", e); }
    </script>
</body>
</html>
